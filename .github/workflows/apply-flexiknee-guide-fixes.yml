name: Apply FlexiKnee guide fixes

on:
  push:
    paths:
      - ".github/workflows/apply-flexiknee-guide-fixes.yml"

permissions:
  contents: write

jobs:
  apply-guide-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guide hub and internal-link updates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function normalizeLineEndings(value) {
            return value.replace(/\r\n/g, "\n");
          }

          function replaceOnce(file, before, after, marker) {
            const raw = fs.readFileSync(file, "utf8");
            const outputLineEnding = raw.includes("\r\n") ? "\r\n" : "\n";
            const original = normalizeLineEndings(raw);
            const expected = normalizeLineEndings(before);
            const replacement = normalizeLineEndings(after);
            const appliedMarker = marker ? normalizeLineEndings(marker) : marker;

            if (appliedMarker && original.includes(appliedMarker)) {
              console.log(`Already applied: ${file}`);
              return false;
            }

            const first = original.indexOf(expected);
            if (first === -1) {
              throw new Error(`Expected source block not found in ${file}`);
            }

            const second = original.indexOf(expected, first + expected.length);
            if (second !== -1) {
              throw new Error(`Expected source block appears more than once in ${file}`);
            }

            const updated = original.slice(0, first) + replacement + original.slice(first + expected.length);
            const output = outputLineEnding === "\r\n" ? updated.replace(/\n/g, "\r\n") : updated;
            fs.writeFileSync(file, output, "utf8");
            console.log(`Updated: ${file}`);
            return true;
          }

