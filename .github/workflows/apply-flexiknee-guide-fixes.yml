name: Apply FlexiKnee guide fixes

on:
  push:
    paths:
      - ".github/workflows/apply-flexiknee-guide-fixes.yml"

permissions:
  contents: write

jobs:
  apply-guide-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source updates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function read(file) {
            return fs.readFileSync(file, "utf8").replace(/\r\n/g, "\n");
          }

          function write(file, text) {
            fs.writeFileSync(file, text, "utf8");
            console.log(`Updated: ${file}`);
          }

          function replaceArray(file, variableName, values) {
            let text = read(file);
            const pattern = new RegExp(`const ${variableName} = \\[[\\s\\S]*?\\n\\];`);
            const match = text.match(pattern);
            if (!match) throw new Error(`Array ${variableName} not found in ${file}`);
            const replacement = `const ${variableName} = [\n${values.map((value) => `  "${value}",`).join("\n")}\n];`;
            if (match[0] === replacement) {
              console.log(`Already current: ${variableName}`);
              return;
            }
            text = text.replace(pattern, replacement);
            write(file, text);
          }

          function insertBefore(file, needle, insertion, marker) {
            let text = read(file);
            if (text.includes(marker)) {
              console.log(`Already applied: ${marker}`);
              return;
            }
            const index = text.indexOf(needle);
            if (index === -1) throw new Error(`Insertion point not found in ${file}: ${needle.slice(0, 80)}`);
            text = text.slice(0, index) + insertion + text.slice(index);
            write(file, text);
          }

          function insertAfterParagraphContaining(file, needle, insertion, marker, sectionStart, sectionEnd) {
            let text = read(file);
            if (text.includes(marker)) {
              console.log(`Already applied: ${marker}`);
              return;
            }

            let searchStart = 0;
            let searchEnd = text.length;
            if (sectionStart) {
              searchStart = text.indexOf(sectionStart);
              if (searchStart === -1) throw new Error(`Section start not found in ${file}`);
            }
            if (sectionEnd) {
              searchEnd = text.indexOf(sectionEnd, searchStart + sectionStart.length);
              if (searchEnd === -1) throw new Error(`Section end not found in ${file}`);
            }

            const needleIndex = text.indexOf(needle, searchStart);
            if (needleIndex === -1 || needleIndex >= searchEnd) {
              throw new Error(`Paragraph needle not found in ${file}: ${needle}`);
            }
            const paragraphEnd = text.indexOf("</p>", needleIndex);
            if (paragraphEnd === -1 || paragraphEnd >= searchEnd) {
              throw new Error(`Paragraph end not found in ${file}`);
            }
            const insertAt = paragraphEnd + 4;
            text = text.slice(0, insertAt) + insertion + text.slice(insertAt);
            write(file, text);
          }

          const guidesFile = "src/pages/Guides.tsx";

          replaceArray(guidesFile, "latestPrioritySlugs", [
            "menopause-knee-pain",
            "glucosamine-chondroitin-knee-pain",
            "red-light-therapy-dose-knees",
            "pickleball-knee-recovery-routine",
            "cordless-rechargeable-heated-knee-massagers-2026",
            "best-insoles-for-knee-pain-2026",
          ]);

          replaceArray(guidesFile, "activitySlugs", [
            "running-knee-pain-guide",
            "pickleball-knee-recovery-routine",
            "knee-arthritis-pain-guide",
            "how-to-strengthen-knees",
            "understanding-knee-injuries",
            "best-running-shoes-knee-pain",
            "how-to-fix-knee-pain",
            "runners-knee-pain-location",
            "why-do-my-knees-crack-or-pop",
            "knee-clicking-when-walking",
            "knee-pain-after-sitting-cross-legged",
            "why-do-my-knees-feel-tight-after-resting",
            "knee-pain-after-standing",
            "knee-pain-exercises-guide",
            "what-causes-knee-pain-guide",
            "knees-hurt-after-resting",
            "cold-weather-knee-pain",
            "knee-pain-after-exercise",
            "knee-pain-when-squatting",
            "knee-weakness-without-pain",
            "plica-syndrome-knee-pain",
            "knee-bursitis-guide",
            "patellofemoral-pain-syndrome",
            "knee-pain-after-car-rides",
            "warm-feeling-in-knee",
            "heavy-feeling-in-knees",
            "knee-pain-when-kneeling",
            "pain-behind-kneecap",
            "exercises-to-relieve-knee-pain-at-home",
            "knee-swelling-after-exercise",
          ]);

          replaceArray(guidesFile, "methodsSlugs", [
            "heat-vs-red-light-therapy",
            "heat-vs-ice-for-knees",
            "red-light-therapy-dose-knees",
            "red-light-therapy-for-knees",
            "daily-knee-care-routine",
            "warmth-vs-infrared-knee-routines",
            "is-infrared-safe-for-knees",
            "who-benefits-from-knee-therapy-devices",
            "heat-red-light-therapy-benefits-2026",
            "knee-warmth-daily-comfort",
            "best-red-light-therapy-knee",
          ]);

          insertBefore(
            guidesFile,
            "// Category 4: Device Comparisons & Buying Guides",
            `// Category 4: Aging, Women & Life Stages\nconst lifeStageSlugs = [\n  "menopause-knee-pain",\n  "knee-pain-after-40",\n  "why-knee-pain-gets-worse-with-age",\n  "morning-knee-stiffness-after-40",\n  "knee-pain-at-night-after-40",\n  "knee-mobility-after-50",\n  "women-men-knee-comfort-patterns",\n];\n\n// Category 5: Supplements & Evidence\nconst supplementSlugs = [\n  "glucosamine-chondroitin-knee-pain",\n  "best-supplements-for-knee-pain",\n];\n\n`,
            "const lifeStageSlugs = ["
          );

          let guides = read(guidesFile);
          if (!guides.includes('["Aging & Women", "by-life-stage"]')) {
            guides = guides.replace(
              '["By Activity", "by-activity"],',
              '["By Activity", "by-activity"],\n                    ["Aging & Women", "by-life-stage"],\n                    ["Supplements", "by-supplements"],'
            );
          }
          guides = guides.replace(/\n\s*\["Buying Guides", "by-devices"\],/, "");
          guides = guides.replace(
            /<p className="text-2xl font-semibold">5<\/p>\n\s*<p className="mt-1 text-xs font-medium text-slate-500">Topic paths<\/p>/,
            '<p className="text-2xl font-semibold">6</p>\n                      <p className="mt-1 text-xs font-medium text-slate-500">Topic paths</p>'
          );
          guides = guides.replace(
            "The newest research-led additions, including our three latest guides on delayed exercise discomfort, cordless massagers and orthopedic insoles.",
            "The newest research-led additions on menopause, glucosamine, red-light dosing, pickleball recovery, cordless massagers, and orthopedic insoles."
          );
          write(guidesFile, guides);

          insertBefore(
            guidesFile,
            "            {/* Category 3: At-Home Methods */}",
            `            {/* Category 3: Aging, Women & Life Stages */}\n            <CategorySection\n              id="by-life-stage"\n              title="Aging, Women & Life Stages"\n              subtitle="Understand how midlife, menopause, age-related changes, sleep, and recovery can shape knee symptoms."\n              contextText={<>Start with our guide to <Link to="/guides/menopause-knee-pain" className="text-primary hover:underline">menopause and knee pain</Link>, then explore <Link to="/guides/knee-pain-after-40" className="text-primary hover:underline">knee pain after 40</Link> and <Link to="/guides/knee-mobility-after-50" className="text-primary hover:underline">knee mobility after 50</Link>.</>}\n              allSlugs={lifeStageSlugs}\n              isLoading={isLoading}\n              bgWhite\n            />\n\n`,
            'id="by-life-stage"'
          );

          insertBefore(
            guidesFile,
            "            {/* Category 4: Device Comparisons */}",
            `            {/* Category 5: Supplements & Evidence */}\n            <CategorySection\n              id="by-supplements"\n              title="Supplements & Evidence"\n              subtitle="Evidence-led guides to popular knee supplements, realistic benefits, product forms, safety, and interactions."\n              contextText={<>Compare our overview of the <Link to="/guides/best-supplements-for-knee-pain" className="text-primary hover:underline">best supplements for knee pain</Link> with the deeper guide to <Link to="/guides/glucosamine-chondroitin-knee-pain" className="text-primary hover:underline">glucosamine and chondroitin</Link>.</>}\n              allSlugs={supplementSlugs}\n              isLoading={isLoading}\n            />\n\n`,
            'id="by-supplements"'
          );

          insertAfterParagraphContaining(
            "src/data/articles/best-supplements-for-knee-pain.tsx",
            "<strong>Glucosamine and chondroitin</strong>",
            `\n        <p>\n          For a closer look at formulation differences, major trials, interactions, and how to run a time-limited test, read our dedicated <Link to="/guides/glucosamine-chondroitin-knee-pain" className="text-blue-600 underline">glucosamine and chondroitin guide</Link>.\n        </p>`,
            "/guides/glucosamine-chondroitin-knee-pain"
          );

          insertBefore(
            "src/data/articles/knee-pain-after-40.tsx",
            "        <h2>Knee Pain in Your 40s vs. Your 50s: Key Differences</h2>",
            `        <p>\n          For women whose symptoms appeared alongside cycle changes, hot flashes, or disrupted sleep, our <Link to="/guides/menopause-knee-pain" className="text-primary hover:underline">menopause and knee pain guide</Link> explains how hormones, muscle, sleep, and midlife factors can overlap without assuming every new ache is hormonal.\n        </p>\n\n`,
            "/guides/menopause-knee-pain"
          );

          insertBefore(
            "src/data/articles/knee-pain-after-exercise.tsx",
            "    <h2>Common Causes of Delayed Knee Pain After Workouts</h2>",
            `    <p>\n      Sport-specific loading also matters. Players dealing with soreness after repeated stops, pivots, and lateral movement can use our <Link to="/guides/pickleball-knee-recovery-routine" className="text-primary hover:underline">pickleball knee recovery routine</Link> for a court-specific cool-down and return-to-play framework.\n    </p>\n\n`,
            "/guides/pickleball-knee-recovery-routine"
          );

          insertAfterParagraphContaining(
            "src/data/articles/legacy-inline-articles.tsx",
            "For a comparison of heat and red light together",
            `\n          <p>\n            Session time alone does not define light dose. Our <Link to="/guides/red-light-therapy-dose-knees" className="text-primary hover:underline">red-light dosing guide</Link> explains irradiance, frequency, device geometry, and why protocols cannot be copied directly between products.\n          </p>`,
            "/guides/red-light-therapy-dose-knees",
            '"red-light-therapy-for-knees": {',
            '"daily-knee-care-routine": {'
          );

          const requiredMarkers = [
            [guidesFile, 'id="by-life-stage"'],
            [guidesFile, 'id="by-supplements"'],
            [guidesFile, '"pickleball-knee-recovery-routine"'],
            [guidesFile, '"red-light-therapy-dose-knees"'],
            ["src/data/articles/best-supplements-for-knee-pain.tsx", "/guides/glucosamine-chondroitin-knee-pain"],
            ["src/data/articles/knee-pain-after-40.tsx", "/guides/menopause-knee-pain"],
            ["src/data/articles/knee-pain-after-exercise.tsx", "/guides/pickleball-knee-recovery-routine"],
            ["src/data/articles/legacy-inline-articles.tsx", "/guides/red-light-therapy-dose-knees"],
          ];

          for (const [file, marker] of requiredMarkers) {
            if (!read(file).includes(marker)) throw new Error(`Validation marker missing: ${marker} in ${file}`);
          }

          console.log("All source markers validated.");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Commit source updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-flexiknee-guide-fixes.yml
          git add src/pages/Guides.tsx \
            src/data/articles/best-supplements-for-knee-pain.tsx \
            src/data/articles/knee-pain-after-40.tsx \
            src/data/articles/knee-pain-after-exercise.tsx \
            src/data/articles/legacy-inline-articles.tsx \
            .github/workflows/apply-flexiknee-guide-fixes.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Improve guide categories and internal links"
          git push origin HEAD:main
