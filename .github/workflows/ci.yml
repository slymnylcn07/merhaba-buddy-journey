name: CI

# Guards the checks AGENTS.md requires before publishing. The full production
# build is not repeated here: it needs Shopify credentials and a headless
# Chromium for prerendering, and the Vercel deployment already exercises it.
# Everything below runs without secrets.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate source
        run: npm run validate:source

      - name: Validate content registry
        run: npm run validate:content

      - name: Test metadata guardrails
        run: npm run test:metadata

      - name: Validate performance assets
        run: npm run validate:assets
