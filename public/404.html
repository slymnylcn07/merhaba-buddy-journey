<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | FlexiKnee</title>
    <meta
      name="description"
      content="The requested FlexiKnee page could not be found. Browse our knee comfort guides or return to the homepage."
    />
    <meta name="robots" content="noindex, follow" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f8fafc; }
      header {
        min-height: 72px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #e2e8f0;
        background: #fff;
      }
      header a {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        color: #0f172a;
        font-size: 21px;
        font-weight: 700;
        text-decoration: none;
      }
      main {
        min-height: calc(100vh - 72px);
        display: grid;
        place-items: center;
        padding: 48px 16px;
      }
      section {
        width: min(680px, 100%);
        padding: 48px 32px;
        text-align: center;
        border: 1px solid #e2e8f0;
        border-radius: 32px;
        background: #fff;
        box-shadow: 0 24px 70px -48px rgba(15, 23, 42, .45);
      }
      .eyebrow {
        margin: 0;
        color: #2563eb;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 14px 0 0;
        font-size: clamp(36px, 7vw, 54px);
        line-height: 1.05;
        letter-spacing: -.04em;
      }
      .copy {
        max-width: 540px;
        margin: 22px auto 0;
        color: #475569;
        font-size: 16px;
        line-height: 1.75;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 30px;
      }
      nav a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      .primary { background: #0f172a; color: #fff; }
      .secondary { border: 1px solid #cbd5e1; color: #1e293b; background: #fff; }
    </style>
  </head>
  <body>
    <header>
      <a href="https://flexi-knee.com/">FlexiKnee</a>
    </header>
    <main>
      <section>
        <p class="eyebrow">Error 404</p>
        <h1>This page could not be found</h1>
        <p class="copy">
          The address may be outdated or the page may have moved. Use one of the links below to continue.
        </p>
        <nav aria-label="404 recovery links">
          <a class="primary" href="https://flexi-knee.com/">Return to Home</a>
          <a class="secondary" href="https://flexi-knee.com/guides">Browse Knee Guides</a>
        </nav>
      </section>
    </main>
  </body>
</html>
