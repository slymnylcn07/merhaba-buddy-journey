<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/?spa_redirect=' + encodeURIComponent(path));
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
