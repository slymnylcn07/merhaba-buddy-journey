<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexiKnee | Official Smart Heated Knee Massager & Guides</title>
    <meta name="author" content="FlexiKnee" />
    
    <!-- Preconnect to external origins for faster resource loading -->
    <link rel="preconnect" href="https://flexi-knee-store.myshopify.com" crossorigin />
    <link rel="dns-prefetch" href="https://flexi-knee-store.myshopify.com" />
<link rel="preconnect" href="https://ipapi.co" crossorigin />
    <link rel="dns-prefetch" href="https://ipapi.co" />
<!-- Preload hero banner images for faster LCP -->
    <link rel="preload" as="image" href="/images/flexiknee-hero-desktop-premium-v2.webp" type="image/webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/flexiknee-hero-final-mobile.png" type="image/png" media="(max-width: 767px)" fetchpriority="high" />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-32.png" />
    
    <!-- Critical inline styles for FCP: paint static hero before CSS bundle loads -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;padding:0;background:#fff;color:#0b1320;font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
      .static-hero{display:block;width:100%;overflow:hidden}
      .static-hero img{display:block;width:100%;height:auto;object-fit:cover}
      #root{min-height:100vh}
    </style>
</head>

  <body>
    <!-- Static hero rendered before React boots for fast LCP -->
    <div class="static-hero" id="static-hero">
      <picture>
        <source media="(min-width: 768px)" srcset="/images/flexiknee-hero-desktop-premium-v2.webp" type="image/webp" />
        <source media="(max-width: 767px)" srcset="/images/flexiknee-hero-final-mobile.png" type="image/png" />
        <img src="/images/flexiknee-hero-final-mobile.png" alt="FlexiKnee Smart Heated Knee Massager" width="450" height="675" fetchpriority="high" decoding="sync" />
      </picture>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
