name: IndexNow SEO Recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN-ONCE after the SEO routing hotfix is deployed and verified"
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit-indexnow:
    if: ${{ github.event.inputs.confirm == 'RUN-ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Submit selected recovery URLs to IndexNow
        env:
          INDEXNOW_URLS: |
            https://flexi-knee.com/
            https://flexi-knee.com/guides
            https://flexi-knee.com/shop
            https://flexi-knee.com/product/knee-massager-smart-red-light-and-massage-therapy
            https://flexi-knee.com/guides/heat-vs-ice-for-knees
            https://flexi-knee.com/guides/do-knee-massagers-work
            https://flexi-knee.com/guides/knee-pain-after-exercise
            https://flexi-knee.com/guides/knee-pain-going-down-stairs
            https://flexi-knee.com/guides/heavy-feeling-in-knees
            https://flexi-knee.com/guides/sudden-knee-pain-guide
            https://flexi-knee.com/guides/knee-clicking-when-walking
            https://flexi-knee.com/guides/knee-pain-getting-up-after-sitting
            https://flexi-knee.com/guides/knee-pain-after-flights
            https://flexi-knee.com/guides/it-band-pain-location-diagram
            https://flexi-knee.com/guides/knee-pain-locations-visual-guide
            https://flexi-knee.com/guides/sharp-knee-pain-guide
            https://flexi-knee.com/guides/knee-weakness-without-pain
            https://flexi-knee.com/guides/why-do-my-knees-hurt-when-sleeping
            https://flexi-knee.com/guides/why-do-my-knees-feel-tight-after-resting
            https://flexi-knee.com/editorial-policy
            https://flexi-knee.com/science
            https://flexi-knee.com/guides/do-knee-massagers-actually-work-guide
            https://flexi-knee.com/guides/heat-or-ice-knee-pain
            https://flexi-knee.com/guides/knee-pain-hiking
