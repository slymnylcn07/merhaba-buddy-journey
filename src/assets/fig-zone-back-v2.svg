  <text x="450" y="306" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">popliteal fossa</text>
  <text x="130" y="292" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#5B21B6">Popliteal fossa</text>
  <text x="130" y="314" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">the hollow BEHIND the knee</text>
  <text x="130" y="334" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">tightness, swelling, Baker's cyst</text>
