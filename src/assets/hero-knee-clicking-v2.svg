<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bgClick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgClick)"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="bold" fill="#0F172A">What makes a knee click?</text>
  <text x="600" y="106" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#64748B">Most clicking is the joint moving, not the joint failing</text>

  <!-- side view of knee, bent -->
  <g transform="translate(330,150)">
    <!-- femur -->
    <path d="M60 0 C 130 0 170 20 176 90 L 182 190 C 186 230 170 250 150 258 L 70 258 C 50 250 40 230 44 190 L 50 90 C 54 20 60 0 60 0 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="4"/>
    <!-- condyle -->
    <ellipse cx="112" cy="270" rx="72" ry="58" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4"/>
    <!-- patella -->
    <ellipse cx="30" cy="258" rx="30" ry="44" fill="#FEF3C7" stroke="#D97706" stroke-width="4"/>
    <!-- cartilage gap -->
    <path d="M52 214 C 72 236 74 292 52 314" stroke="#3B82F6" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- tibia -->
    <path d="M58 330 C 110 322 168 330 174 366 L 176 500 L 62 500 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="4"/>
    <!-- motion arc -->
    <path d="M210 250 A 110 110 0 0 1 190 380" stroke="#2563EB" stroke-width="5" fill="none" stroke-dasharray="10 10" stroke-linecap="round"/>
    <path d="M190 380 l14 -6 l-3 18 Z" fill="#2563EB"/>
    <!-- click bursts -->
    <g stroke="#F59E0B" stroke-width="5" stroke-linecap="round">
      <path d="M170 236 l24 -14 M182 258 l28 -2 M170 284 l24 14"/>
    </g>
    <text x="228" y="212" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#92400E">click</text>
  </g>

  <!-- explanation cards -->
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="700" y="180" width="420" height="98" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="740" cy="228" r="16" fill="#DBEAFE"/>
    <text x="740" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#1D4ED8">1</text>
    <text x="770" y="216" font-size="19" font-weight="bold" fill="#0F172A">Gas bubbles releasing</text>
    <text x="770" y="248" font-size="16" fill="#64748B">Painless pops from fluid inside the joint</text>

    <rect x="700" y="296" width="420" height="98" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="740" cy="344" r="16" fill="#DBEAFE"/>
    <text x="740" y="351" text-anchor="middle" font-size="17" font-weight="bold" fill="#1D4ED8">2</text>
    <text x="770" y="332" font-size="19" font-weight="bold" fill="#0F172A">Tendons gliding</text>
    <text x="770" y="364" font-size="16" fill="#64748B">Soft tissue snapping over bone as you bend</text>

    <rect x="700" y="412" width="420" height="98" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="740" cy="460" r="16" fill="#FEE2E2"/>
    <text x="740" y="467" text-anchor="middle" font-size="17" font-weight="bold" fill="#B91C1C">3</text>
    <text x="770" y="448" font-size="19" font-weight="bold" fill="#0F172A">Clicking with pain</text>
    <text x="770" y="480" font-size="16" fill="#64748B">Pain, swelling or locking is worth checking</text>
  </g>

  <text x="600" y="644" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#64748B" font-style="italic">Silent clicking is usually harmless. Clicking plus pain, swelling or giving way is the signal that matters.</text>
</svg>
