<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460">
  <rect width="1000" height="460" fill="#F8FAFC"/>
  <text x="500" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#0F172A">How graduated compression works in a knee sleeve</text>
  <g transform="translate(370,80)">
    <path d="M90 0 C 150 0 185 35 185 95 L 185 140 C 185 175 160 190 160 220 C 160 250 185 265 185 300 L 185 240 L 185 300 C 185 300 185 300 185 300 L 185 305 C 185 305 75 305 75 305 L -5 305 L -5 300 C -5 265 20 250 20 220 C 20 190 -5 175 -5 140 L -5 95 C -5 35 30 0 90 0 Z" fill="#E2E8F0" stroke="#64748B" stroke-width="4"/>
    <circle cx="90" cy="218" r="34" fill="#F8FAFC" stroke="#64748B" stroke-width="3"/>
    <text x="90" y="224" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">kneecap</text>
    <rect x="-5" y="18" width="190" height="34" rx="10" fill="#93C5FD" opacity="0.85"/>
    <rect x="-2" y="120" width="184" height="34" rx="10" fill="#3B82F6" opacity="0.8"/>
    <rect x="-2" y="258" width="184" height="34" rx="10" fill="#1D4ED8" opacity="0.85"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#334155">
    <text x="620" y="118" font-weight="bold" fill="#1E40AF">Lighter at the top</text>
    <text x="620" y="142">keeps the sleeve from digging in</text>
    <text x="620" y="222" font-weight="bold" fill="#1E40AF">Medium mid-zone</text>
    <text x="620" y="246">supportive hug around the joint</text>
    <text x="620" y="356" font-weight="bold" fill="#1E40AF">Firmer at the bottom</text>
    <text x="620" y="380">encourages fluid to move upward</text>
    <line x1="560" y1="112" x2="480" y2="118" stroke="#94A3B8" stroke-width="3"/>
    <line x1="560" y1="216" x2="510" y2="218" stroke="#94A3B8" stroke-width="3"/>
    <line x1="560" y1="350" x2="480" y2="356" stroke="#94A3B8" stroke-width="3"/>
  </g>
</svg>
