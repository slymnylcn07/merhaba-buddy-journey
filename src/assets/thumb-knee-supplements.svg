  <defs><linearGradient id="suBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F0FDF4"/><stop offset="100%" stop-color="#DCFCE7"/></linearGradient></defs>
  <rect width="1200" height="900" fill="url(#suBg)"/>
