<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640">
  <rect width="1000" height="640" fill="#FFFFFF"/>
  <text x="500" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#0F172A">How exercise loads the kneecap</text>

  <!-- thigh (femur) -->
  <path d="M430 80 C 470 78 520 90 528 140 L 540 250 C 545 285 552 300 552 315 L 430 315 C 430 300 428 285 430 250 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"/>
  <text x="600" y="150" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#334155">Femur (thigh bone)</text>
  <line x1="592" y1="144" x2="540" y2="160" stroke="#94A3B8" stroke-width="2"/>

  <!-- femoral condyles -->
  <ellipse cx="470" cy="330" rx="48" ry="42" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
  <ellipse cx="536" cy="330" rx="42" ry="40" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>

  <!-- kneecap (patella) -->
  <ellipse cx="392" cy="322" rx="34" ry="46" fill="#FEF3C7" stroke="#D97706" stroke-width="4"/>
  <text x="150" y="300" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#92400E">Kneecap</text>
  <text x="150" y="325" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#92400E">(patella)</text>
  <line x1="262" y1="310" x2="356" y2="318" stroke="#D97706" stroke-width="2"/>

  <!-- cartilage layer between patella and femur -->
  <path d="M424 288 C 440 300 442 348 424 360" stroke="#3B82F6" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.75"/>
  <text x="600" y="300" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1D4ED8">Cartilage surface</text>
  <line x1="592" y1="294" x2="452" y2="322" stroke="#60A5FA" stroke-width="2"/>

  <!-- compression arrow -->
  <path d="M250 400 L 350 348" stroke="#DC2626" stroke-width="14" stroke-linecap="round"/>
  <path d="M350 348 l-6 26 l28 -10 Z" fill="#DC2626"/>
  <text x="150" y="430" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#B91C1C">Compression</text>
  <text x="150" y="455" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="bold" fill="#B91C1C">force</text>

  <!-- patellar tendon -->
  <path d="M382 368 L 392 470" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round"/>
  <text x="150" y="520" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#334155">Patellar tendon</text>
  <line x1="272" y1="514" x2="376" y2="480" stroke="#94A3B8" stroke-width="2"/>

  <!-- TIBIA: large inner bone -->
  <path d="M436 380 C 470 378 508 386 512 420 L 508 600 L 440 600 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"/>
  <text x="600" y="500" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#334155">Tibia (shin bone, larger)</text>
  <line x1="592" y1="494" x2="506" y2="490" stroke="#94A3B8" stroke-width="2"/>

  <!-- FIBULA: thin OUTER bone, correctly on the outer side -->
  <path d="M540 392 C 556 396 562 410 560 430 L 556 600 L 528 600 L 528 430 C 526 410 528 396 540 392 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
  <text x="600" y="560" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#334155">Fibula (thin outer bone)</text>
  <line x1="592" y1="554" x2="558" y2="540" stroke="#94A3B8" stroke-width="2"/>

  <text x="500" y="622" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B" font-style="italic">Squats, stairs and running press the kneecap against the femur, so load builds where the cartilage meets.</text>
</svg>
