<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Menopause knee pain pathway</title><desc id="desc">A network showing how hormonal transition can interact with sleep, muscle, body composition, activity, and pain processing.</desc>
<rect width="1400" height="900" rx="44" fill="#fff7fb"/>
<text x="700" y="78" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#0f172a">A hormone transition can change the whole system</text>
<g font-family="Arial" text-anchor="middle">
 <circle cx="700" cy="400" r="130" fill="#ede9fe" stroke="#7c3aed" stroke-width="7"/><text x="700" y="385" font-size="37" font-weight="700" fill="#5b21b6">MENOPAUSAL</text><text x="700" y="430" font-size="37" font-weight="700" fill="#5b21b6">TRANSITION</text>
 <g><line x1="590" y1="340" x2="325" y2="220" stroke="#c4b5fd" stroke-width="9"/><rect x="95" y="135" width="330" height="170" rx="30" fill="#fff" stroke="#ddd6fe" stroke-width="4"/><text x="260" y="205" font-size="31" font-weight="700" fill="#0f172a">Sleep disruption</text><text x="260" y="250" font-size="25" fill="#64748b">Lower recovery, more pain</text></g>
 <g><line x1="810" y1="340" x2="1075" y2="220" stroke="#f9a8d4" stroke-width="9"/><rect x="975" y="135" width="330" height="170" rx="30" fill="#fff" stroke="#fbcfe8" stroke-width="4"/><text x="1140" y="205" font-size="31" font-weight="700" fill="#0f172a">Muscle changes</text><text x="1140" y="250" font-size="25" fill="#64748b">Strength and load capacity</text></g>
 <g><line x1="575" y1="450" x2="310" y2="580" stroke="#93c5fd" stroke-width="9"/><rect x="80" y="540" width="350" height="180" rx="30" fill="#fff" stroke="#bfdbfe" stroke-width="4"/><text x="255" y="610" font-size="31" font-weight="700" fill="#0f172a">Body composition</text><text x="255" y="655" font-size="25" fill="#64748b">Weight and fat distribution</text></g>
 <g><line x1="825" y1="450" x2="1090" y2="580" stroke="#5eead4" stroke-width="9"/><rect x="970" y="540" width="350" height="180" rx="30" fill="#fff" stroke="#99f6e4" stroke-width="4"/><text x="1145" y="610" font-size="31" font-weight="700" fill="#0f172a">Pain processing</text><text x="1145" y="655" font-size="25" fill="#64748b">Sensitivity, mood, fatigue</text></g>
 <g><line x1="700" y1="530" x2="700" y2="700" stroke="#fbbf24" stroke-width="9"/><rect x="505" y="680" width="390" height="150" rx="30" fill="#fff" stroke="#fde68a" stroke-width="4"/><text x="700" y="742" font-size="31" font-weight="700" fill="#0f172a">Knee symptoms</text><text x="700" y="787" font-size="25" fill="#64748b">Stiffness, aches, flares</text></g>
</g>
</svg>
