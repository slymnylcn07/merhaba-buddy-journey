<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#F8FAFC"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Where sudden knee pain shows up</text>

  <!-- FRONT VIEW -->
  <text x="290" y="82" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#1E40AF">Front view (right knee)</text>
  <path d="M240 100 C 300 96 348 112 352 170 L 356 260 C 358 300 352 330 352 370 C 352 430 358 470 356 520 L 236 520 C 234 470 240 430 240 370 C 240 330 234 300 236 260 L 236 170 C 236 112 240 100 240 100 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"/>
  <!-- front/kneecap zone -->
  <ellipse cx="296" cy="310" rx="40" ry="48" fill="#3B82F6" opacity="0.55"/>
  <text x="296" y="316" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">FRONT</text>
  <!-- inner zone (medial = toward midline; right knee front view => left side of image is outer? keep explicit labels) -->
  <ellipse cx="352" cy="330" rx="26" ry="42" fill="#22C55E" opacity="0.6"/>
  <ellipse cx="240" cy="330" rx="26" ry="42" fill="#F97316" opacity="0.6"/>
  <text x="470" y="300" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#166534">Inner side (medial)</text>
  <text x="470" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">faces the other knee</text>
  <line x1="462" y1="294" x2="376" y2="322" stroke="#86EFAC" stroke-width="2"/>
  <text x="60" y="300" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#9A3412">Outer side (lateral)</text>
  <text x="60" y="322" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">faces away from body</text>
  <line x1="210" y1="294" x2="222" y2="322" stroke="#FDBA74" stroke-width="2"/>
  <text x="296" y="245" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1D4ED8">Kneecap area</text>

  <!-- BACK VIEW -->
  <text x="740" y="82" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#1E40AF">Back view (same knee)</text>
  <path d="M690 100 C 750 96 798 112 802 170 L 806 260 C 808 300 802 330 802 370 C 802 430 808 470 806 520 L 686 520 C 684 470 690 430 690 370 C 690 330 684 300 686 260 L 686 170 C 686 112 690 100 690 100 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"/>
  <ellipse cx="746" cy="320" rx="46" ry="52" fill="#A855F7" opacity="0.55"/>
  <text x="746" y="326" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">BEHIND</text>
  <text x="746" y="245" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#6B21A8">Back of the knee</text>
  <text x="746" y="410" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">only visible from behind</text>

  <text x="500" y="572" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B" font-style="italic">Pain location narrows the likely cause. Sudden pain with swelling, locking or giving way needs assessment.</text>
</svg>
