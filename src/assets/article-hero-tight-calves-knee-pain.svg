<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Tight calves and knee pain</title><desc id="d">A leg diagram showing the calf, ankle and knee linked as one chain.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
<linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e2e8f0"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="90" y="150" font-family="Inter,Arial,Helvetica,sans-serif" font-size="62" font-weight="700" fill="#020617">The calf, ankle and knee</text>
<text x="90" y="222" font-family="Inter,Arial,Helvetica,sans-serif" font-size="62" font-weight="700" fill="#2563eb">work as one chain</text>
<text x="90" y="300" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" fill="#475569">When the calf loses length, the ankle loses motion,</text>
<text x="90" y="344" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" fill="#475569">and the knee absorbs what is left over.</text>
<g transform="translate(950,90)">
  <path d="M150 40 C120 130, 122 220, 140 290 L250 290 C268 220, 270 130, 240 40 Z" fill="url(#lg)"/>
  <ellipse cx="195" cy="320" rx="62" ry="52" fill="#bfdbfe"/>
  <circle cx="195" cy="320" r="26" fill="#2563eb" opacity=".35"/>
  <path d="M142 356 C130 470, 138 560, 152 640 L238 640 C252 560, 260 470, 248 356 Z" fill="url(#lg)"/>
  <ellipse cx="195" cy="470" rx="58" ry="86" fill="#fb923c" opacity=".35"/>
  <ellipse cx="195" cy="470" rx="34" ry="58" fill="#f97316" opacity=".45"/>
  <ellipse cx="195" cy="672" rx="44" ry="30" fill="#bfdbfe"/>
  <text x="300" y="326" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#1d4ed8">Knee</text>
  <text x="300" y="478" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#c2410c">Calf</text>
  <text x="300" y="682" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#1d4ed8">Ankle</text>
  <path d="M195 402 L195 424" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M195 540 L195 620" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 12"/>
</g>
<rect x="90" y="420" width="640" height="120" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="3"/>
<text x="126" y="470" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#020617">Gastrocnemius crosses the knee joint</text>
<text x="126" y="510" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#475569">so calf tension pulls directly behind the knee</text>
</svg>