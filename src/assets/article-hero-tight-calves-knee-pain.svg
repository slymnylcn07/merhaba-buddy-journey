<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Tight calves and knee pain</title><desc id="d">An anatomical leg showing the gastrocnemius crossing the knee joint, with the calf highlighted.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
  <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f1f5f9"/><stop offset=".45" stop-color="#e2e8f0"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
  <linearGradient id="musc" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
  <radialGradient id="hot" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f97316" stop-opacity=".38"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1180" cy="470" r="330" fill="#dbeafe" opacity=".45"/>

<text x="96" y="196" font-family="Inter,Arial,Helvetica,sans-serif" font-size="66" font-weight="700" fill="#0f172a" letter-spacing="-2">Tight calves,</text>
<text x="96" y="278" font-family="Inter,Arial,Helvetica,sans-serif" font-size="66" font-weight="700" fill="#ea580c" letter-spacing="-2">aching knees</text>
<rect x="96" y="322" width="96" height="6" rx="3" fill="#ea580c"/>
<text x="96" y="396" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" fill="#475569">The larger calf muscle starts above the knee,</text>
<text x="96" y="438" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" fill="#475569">so calf tension pulls on the joint itself.</text>

<g font-family="Inter,Arial,Helvetica,sans-serif">
  <rect x="96" y="512" width="300" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="126" y="552" font-size="21" font-weight="700" fill="#0f172a">Gastrocnemius</text>
  <text x="126" y="580" font-size="18" fill="#64748b">stretch: knee straight</text>
  <rect x="420" y="512" width="300" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="552" font-size="21" font-weight="700" fill="#0f172a">Soleus</text>
  <text x="450" y="580" font-size="18" fill="#64748b">stretch: knee bent</text>
</g>
<text x="96" y="678" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#0f766e">Most people only ever stretch the first one.</text>

<g transform="translate(1010,110)">
  <ellipse cx="176" cy="690" rx="132" ry="20" fill="#0f172a" opacity=".07"/>
  <path d="M118 0 C104 96, 106 176, 122 236 L230 236 C246 176, 248 96, 234 0 Z" fill="url(#limb)"/>
  <circle cx="176" cy="272" r="76" fill="url(#hot)"/>
  <ellipse cx="176" cy="272" rx="52" ry="46" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <ellipse cx="176" cy="272" rx="24" ry="21" fill="#cbd5e1"/>
  <path d="M124 312 C110 420, 118 552, 132 666 L220 666 C234 552, 242 420, 228 312 Z" fill="url(#limb)"/>
  <path d="M140 250 C126 300, 122 372, 138 430 C150 470, 164 486, 176 486 C188 486, 202 470, 214 430 C230 372, 226 300, 212 250 C200 292, 196 320, 176 322 C156 320, 152 292, 140 250 Z" fill="url(#musc)" opacity=".92"/>
  <path d="M176 486 L176 606" stroke="#ea580c" stroke-width="9" stroke-linecap="round" opacity=".55"/>
  <ellipse cx="176" cy="646" rx="46" ry="26" fill="#cbd5e1"/>
  <circle cx="176" cy="250" r="9" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <path d="M186 246 L280 214" stroke="#ea580c" stroke-width="3"/>
  <text x="290" y="220" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#ea580c">Attaches above the knee</text>
  <circle cx="176" cy="596" r="9" fill="#ffffff" stroke="#0f766e" stroke-width="4"/>
  <path d="M186 596 L280 622" stroke="#0f766e" stroke-width="3"/>
  <text x="290" y="630" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#0f766e">Limits ankle motion</text>
</g>
</svg>