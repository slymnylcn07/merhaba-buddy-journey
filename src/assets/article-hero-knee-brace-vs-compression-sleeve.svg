<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Knee brace compared with a compression sleeve</title><desc id="d">A sleeve and a hinged brace shown side by side with the job each one does.</desc>
<defs>
  <linearGradient id="sky2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
  <linearGradient id="limb2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f1f5f9"/><stop offset=".45" stop-color="#e2e8f0"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
  <linearGradient id="knit" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#sky2)"/>
<text x="96" y="180" font-family="Inter,Arial,Helvetica,sans-serif" font-size="62" font-weight="700" fill="#0f172a" letter-spacing="-2">Sleeve or brace?</text>
<rect x="96" y="212" width="96" height="6" rx="3" fill="#2563eb"/>
<text x="96" y="286" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" fill="#475569">They are not competing products.</text>
<text x="96" y="328" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" fill="#475569">They solve two different problems.</text>

<g transform="translate(96,420)" font-family="Inter,Arial,Helvetica,sans-serif">
  <rect x="0" y="0" width="360" height="150" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="28" y="52" font-size="24" font-weight="700" fill="#1d4ed8">Ache but stable</text>
  <text x="28" y="92" font-size="20" fill="#1e40af">Warmth, feedback, mild</text>
  <text x="28" y="120" font-size="20" fill="#1e40af">swelling: start with a sleeve</text>
  <rect x="0" y="176" width="360" height="150" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
  <text x="28" y="228" font-size="24" font-weight="700" fill="#0f172a">Gives way or locks</text>
  <text x="28" y="268" font-size="20" fill="#334155">Get it assessed first, then</text>
  <text x="28" y="296" font-size="20" fill="#334155">fit a hinged brace</text>
</g>

<g transform="translate(760,130)">
  <ellipse cx="180" cy="646" rx="120" ry="18" fill="#0f172a" opacity=".07"/>
  <path d="M126 0 C112 92, 114 172, 130 230 L230 230 C246 172, 248 92, 234 0 Z" fill="url(#limb2)"/>
  <path d="M132 306 C120 420, 126 540, 140 624 L220 624 C234 540, 240 420, 228 306 Z" fill="url(#limb2)"/>
  <rect x="108" y="212" width="144" height="122" rx="34" fill="url(#knit)" opacity=".85"/>
  <ellipse cx="180" cy="272" rx="34" ry="30" fill="#eff6ff" opacity=".55"/>
  <path d="M114 240 h132 M114 272 h132 M114 304 h132" stroke="#ffffff" stroke-width="2" opacity=".35"/>
  <text x="180" y="700" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1d4ed8">Compression sleeve</text>
  <text x="180" y="736" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" fill="#64748b">no moving parts</text>
</g>

<g transform="translate(1160,130)">
  <ellipse cx="180" cy="646" rx="120" ry="18" fill="#0f172a" opacity=".07"/>
  <path d="M126 0 C112 92, 114 172, 130 230 L230 230 C246 172, 248 92, 234 0 Z" fill="url(#limb2)"/>
  <path d="M132 306 C120 420, 126 540, 140 624 L220 624 C234 540, 240 420, 228 306 Z" fill="url(#limb2)"/>
  <rect x="112" y="216" width="136" height="114" rx="18" fill="#94a3b8" opacity=".5"/>
  <rect x="96" y="196" width="20" height="76" rx="10" fill="url(#steel)"/>
  <rect x="244" y="196" width="20" height="76" rx="10" fill="url(#steel)"/>
  <rect x="96" y="290" width="20" height="76" rx="10" fill="url(#steel)"/>
  <rect x="244" y="290" width="20" height="76" rx="10" fill="url(#steel)"/>
  <circle cx="106" cy="281" r="19" fill="#0f172a"/><circle cx="106" cy="281" r="7" fill="#94a3b8"/>
  <circle cx="254" cy="281" r="19" fill="#0f172a"/><circle cx="254" cy="281" r="7" fill="#94a3b8"/>
  <rect x="104" y="226" width="152" height="14" rx="7" fill="#334155"/>
  <rect x="104" y="308" width="152" height="14" rx="7" fill="#334155"/>
  <text x="180" y="700" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0f172a">Hinged brace</text>
  <text x="180" y="736" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" fill="#64748b">real side-to-side support</text>
</g>
</svg>