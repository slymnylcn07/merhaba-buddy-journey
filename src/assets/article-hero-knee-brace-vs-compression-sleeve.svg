<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Knee brace compared with a compression sleeve</title><desc id="d">A sleeve and a hinged brace side by side with their different jobs.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="90" y="150" font-family="Inter,Arial,Helvetica,sans-serif" font-size="60" font-weight="700" fill="#020617">Sleeve or brace?</text>
<text x="90" y="222" font-family="Inter,Arial,Helvetica,sans-serif" font-size="60" font-weight="700" fill="#2563eb">They do different jobs</text>
<text x="90" y="300" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" fill="#475569">One adds feedback and warmth. The other adds mechanical</text>
<text x="90" y="342" font-family="Inter,Arial,Helvetica,sans-serif" font-size="29" fill="#475569">stability. Buying the wrong one wastes money and time.</text>
<g transform="translate(880,120)">
  <rect x="0" y="60" width="290" height="560" rx="40" fill="#ffffff" stroke="#dbeafe" stroke-width="4"/>
  <text x="145" y="130" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">Sleeve</text>
  <path d="M85 200 C60 260, 62 340, 78 400 L212 400 C228 340, 230 260, 205 200 Z" fill="#e2e8f0"/>
  <rect x="70" y="250" width="150" height="120" rx="26" fill="#3b82f6" opacity=".55"/>
  <text x="145" y="470" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#475569">Warmth, feedback,</text>
  <text x="145" y="506" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#475569">mild swelling control</text>
  <text x="145" y="566" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#059669">Everyday aches</text>

  <rect x="330" y="60" width="290" height="560" rx="40" fill="#ffffff" stroke="#dbeafe" stroke-width="4"/>
  <text x="475" y="130" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">Hinged brace</text>
  <path d="M415 200 C390 260, 392 340, 408 400 L542 400 C558 340, 560 260, 535 200 Z" fill="#e2e8f0"/>
  <rect x="398" y="240" width="154" height="140" rx="18" fill="#94a3b8" opacity=".5"/>
  <circle cx="398" cy="310" r="20" fill="#0f172a"/><circle cx="552" cy="310" r="20" fill="#0f172a"/>
  <rect x="386" y="230" width="24" height="70" rx="10" fill="#0f172a"/><rect x="540" y="230" width="24" height="70" rx="10" fill="#0f172a"/>
  <text x="475" y="470" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#475569">Side to side stability,</text>
  <text x="475" y="506" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#475569">controlled movement</text>
  <text x="475" y="566" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#c2410c">Instability, injury</text>
</g>
</svg>