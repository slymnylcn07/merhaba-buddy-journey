<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Setting up a standing station for your knees</text>
  <text x="450" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B">Four choices that lower the daily toll</text>

  <!-- floor -->
  <rect x="120" y="360" width="660" height="20" rx="6" fill="#E2E8F0"/>
  <!-- anti-fatigue mat -->
  <rect x="200" y="344" width="180" height="18" rx="6" fill="#3B82F6" opacity="0.7"/>
  <text x="290" y="410" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1D4ED8">Anti-fatigue mat</text>
  <text x="290" y="432" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">Cushions hard floors</text>

  <!-- footrest bar -->
  <rect x="470" y="330" width="90" height="12" rx="4" fill="#F59E0B"/>
  <line x1="480" y1="342" x2="480" y2="378" stroke="#94A3B8" stroke-width="4"/>
  <line x1="550" y1="342" x2="550" y2="378" stroke="#94A3B8" stroke-width="4"/>
  <text x="620" y="336" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#B45309">Footrest bar</text>
  <text x="620" y="358" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">Rest one foot up to</text>
  <text x="620" y="376" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">unload the low back</text>

  <!-- shoe -->
  <path d="M150 340 q 10 -20 40 -18 l 40 4 q 20 2 30 14 l -110 0 Z" fill="#16A34A" opacity="0.8"/>
  <text x="180" y="200" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#166534">Supportive shoes</text>
  <text x="180" y="222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">Cushioned, stable,</text>
  <text x="180" y="240" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">replaced when worn</text>
  <line x1="180" y1="250" x2="180" y2="330" stroke="#86EFAC" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- sit break icon -->
  <g transform="translate(660,180)">
    <rect x="-30" y="-20" width="60" height="50" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <path d="M-14 -4 l0 -14 l28 0" stroke="#7C3AED" stroke-width="3" fill="none"/>
    <text x="0" y="60" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#5B21B6">Planned sit breaks</text>
    <text x="0" y="82" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">A few minutes off the</text>
    <text x="0" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569">feet each hour helps</text>
  </g>

  <text x="450" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B" font-style="italic">You cannot always change the job, but you can often change the surface, the shoes and the pauses.</text>
</svg>
