<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Factors That Contribute to Knee Control</title><desc id="desc">A “weak” or unsteady feeling can have more than one contributor.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Factors That Contribute to Knee Control</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">A “weak” or unsteady feeling can have more than one contributor.</text>
<rect x="80" y="175" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="148" cy="247" r="36" fill="white" stroke="#2563EB" stroke-width="6"/><path d="M130 247 L144 263 L168 227" stroke="#2563EB" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="205" y="241" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Muscle capacity</text><text x="205" y="278" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Quadriceps, hamstrings, calves, and hips</text><rect x="620" y="175" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="688" cy="247" r="36" fill="white" stroke="#0F766E" stroke-width="6"/><path d="M670 247 L684 263 L708 227" stroke="#0F766E" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="745" y="241" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Balance and coordination</text><text x="745" y="278" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">How the body responds during each step</text><rect x="80" y="420" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="148" cy="492" r="36" fill="white" stroke="#7C3AED" stroke-width="6"/><path d="M130 492 L144 508 L168 472" stroke="#7C3AED" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="205" y="486" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Hip and ankle control</text><text x="205" y="523" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Alignment above and below the knee</text><rect x="620" y="420" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="688" cy="492" r="36" fill="white" stroke="#EA580C" stroke-width="6"/><path d="M670 492 L684 508 L708 472" stroke="#EA580C" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="745" y="486" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Joint and nerve factors</text><text x="745" y="523" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Swelling, injury, or altered sensation may</text><text x="745" y="548" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">matter</text></svg>