<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Possible Contributors to a Tight Knee Feeling</title><desc id="desc">Tightness without pain can come from different tissues and movement patterns.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Possible Contributors to a Tight Knee Feeling</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">Tightness without pain can come from different tissues and movement patterns.</text>
<rect x="90" y="175" width="490" height="190" rx="28" fill="white" stroke="#2563EB" stroke-width="3"/><rect x="112" y="199" width="10" height="140" rx="5" fill="#2563EB"/><text x="148" y="240" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F172A">Front of thigh</text><text x="148" y="280" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">Quadriceps tension or fatigue</text><rect x="620" y="175" width="490" height="190" rx="28" fill="white" stroke="#EA580C" stroke-width="3"/><rect x="642" y="199" width="10" height="140" rx="5" fill="#EA580C"/><text x="678" y="240" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F172A">Back of thigh</text><text x="678" y="280" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">Hamstring tension or reduced flexibility</text><rect x="90" y="420" width="490" height="190" rx="28" fill="white" stroke="#0F766E" stroke-width="3"/><rect x="112" y="444" width="10" height="140" rx="5" fill="#0F766E"/><text x="148" y="485" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F172A">Calf and ankle</text><text x="148" y="525" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">Lower-leg stiffness can alter movement</text><rect x="620" y="420" width="490" height="190" rx="28" fill="white" stroke="#7C3AED" stroke-width="3"/><rect x="642" y="444" width="10" height="140" rx="5" fill="#7C3AED"/><text x="678" y="485" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F172A">Joint or swelling</text><text x="678" y="525" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">Persistent fullness or restricted motion needs assessment</text><text x="600" y="685" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">An illustration cannot identify the cause. New swelling, locking, instability, or persistent symptoms deserve professional advice.</text></svg>