<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Supported Sitting Options</title><desc id="desc">There is no single perfect angle. Comfort and regular position changes matter.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Supported Sitting Options</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">There is no single perfect angle. Comfort and regular position changes matter.</text>
<rect x="80" y="165" width="500" height="455" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="104" y="207" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Supported position</text><rect x="620" y="165" width="500" height="455" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="644" y="207" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Change position regularly</text><rect x="230" y="390" width="200" height="18" rx="9" fill="#475569"/><path d="M255 408 L255 565 M405 408 L405 565" stroke="#475569" stroke-width="11"/><circle cx="330" cy="250" r="25" fill="#F0C7A5" stroke="#0F172A" stroke-width="5"/><path d="M330 278 L330 390" stroke="#0F172A" stroke-width="18"/><path d="M330 385 L285 480 L295 560" stroke="#0F172A" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M330 385 L375 480 L365 560" stroke="#0F172A" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M275 560 L325 560 M345 560 L395 560" stroke="#2563EB" stroke-width="13" stroke-linecap="round"/><rect x="770" y="390" width="200" height="18" rx="9" fill="#475569"/><path d="M795 408 L795 565 M945 408 L945 565" stroke="#475569" stroke-width="11"/><circle cx="870" cy="250" r="25" fill="#F0C7A5" stroke="#0F172A" stroke-width="5"/><path d="M870 278 L870 390" stroke="#0F172A" stroke-width="18"/><path d="M870 385 L825 480 L835 560" stroke="#0F172A" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M870 385 L915 480 L905 560" stroke="#0F172A" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M815 560 L865 560 M885 560 L935 560" stroke="#2563EB" stroke-width="13" stroke-linecap="round"/><path d="M220 585 L440 585" stroke="#0F766E" stroke-width="7"/><text x="330" y="610" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Feet supported; seat height comfortable</text><path d="M770 520 Q870 455 970 520" stroke="#2563EB" stroke-width="8" fill="none" marker-end="url(#arrow)"/><text x="870" y="610" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Extend, stand, or walk briefly when helpful</text><rect x="190" y="650" width="820" height="62" rx="22" fill="#EFF6FF" stroke="#BFDBFE"/><text x="600" y="689" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#2563EB">Use a footrest if needed and avoid forcing a position that increases symptoms.</text></svg>