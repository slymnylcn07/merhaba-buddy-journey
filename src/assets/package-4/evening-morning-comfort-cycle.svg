<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">An Evening-to-Morning Knee Comfort Plan</title><desc id="desc">Night symptoms can have many causes. This routine focuses on practical, low-risk comfort steps.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">An Evening-to-Morning Knee Comfort Plan</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">Night symptoms can have many causes. This routine focuses on practical, low-risk comfort steps.</text>
<rect x="65" y="185" width="230" height="410" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="110" cy="240" r="28" fill="#EA580C"/><text x="110" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="white">1</text><text x="87" y="320" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A">Evening check-in</text><text x="87" y="360" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Note activity, swelling,</text><text x="87" y="387" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">warmth, or a new injury</text><path d="M303 390 L335 390" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow)"/><rect x="345" y="185" width="230" height="410" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="390" cy="240" r="28" fill="#7C3AED"/><text x="390" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="white">2</text><text x="367" y="320" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A">Comfortable sleep setup</text><text x="367" y="360" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Use pillows only if they</text><text x="367" y="387" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">improve your position</text><path d="M583 390 L615 390" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow)"/><rect x="625" y="185" width="230" height="410" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="670" cy="240" r="28" fill="#2563EB"/><text x="670" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="white">3</text><text x="647" y="320" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A">Gentle first movements</text><text x="647" y="360" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Try ankle pumps or a</text><text x="647" y="387" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">small knee bend before</text><text x="647" y="414" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">standing</text><path d="M863 390 L895 390" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow)"/><rect x="905" y="185" width="230" height="410" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="950" cy="240" r="28" fill="#0F766E"/><text x="950" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="white">4</text><text x="927" y="320" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A">Reassess in the morning</text><text x="927" y="360" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Seek advice for</text><text x="927" y="387" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">persistent or worsening</text><text x="927" y="414" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">symptoms</text><text x="600" y="685" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">A diagram cannot determine whether symptoms come from osteoarthritis, tendons, bursae, nerves, or another cause.</text></svg>