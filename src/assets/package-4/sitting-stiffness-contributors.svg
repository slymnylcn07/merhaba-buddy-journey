<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Possible Contributors After Prolonged Sitting</title><desc id="desc">No single diagram can explain every person’s stiffness or discomfort.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Possible Contributors After Prolonged Sitting</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">No single diagram can explain every person’s stiffness or discomfort.</text>
<rect x="80" y="175" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="145" cy="240" r="32" fill="#2563EB"/><text x="145" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="white">•</text><text x="200" y="235" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F172A">Sustained bend</text><text x="200" y="271" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">A long-held knee angle may feel uncomfortable</text><rect x="620" y="175" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="685" cy="240" r="32" fill="#0F766E"/><text x="685" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="white">•</text><text x="740" y="235" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F172A">Less muscle activity</text><text x="740" y="271" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">The first stand can feel less coordinated</text><rect x="80" y="420" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="145" cy="485" r="32" fill="#EA580C"/><text x="145" y="494" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="white">•</text><text x="200" y="480" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F172A">Tissue sensitivity</text><text x="200" y="516" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Existing joint or tendon symptoms may become</text><text x="200" y="541" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">noticeable</text><rect x="620" y="420" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="685" cy="485" r="32" fill="#7C3AED"/><text x="685" y="494" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="white">•</text><text x="740" y="480" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F172A">Seat and foot support</text><text x="740" y="516" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Height and foot position can change comfort</text></svg>