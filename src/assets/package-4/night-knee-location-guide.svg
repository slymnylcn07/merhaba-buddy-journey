<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Where Is the Night-Time Knee Symptom?</title><desc id="desc">Location can guide questions, but it cannot diagnose the cause by itself.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient></defs><rect width="1200" height="760" fill="url(#bg)"/><rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1"/><text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Where Is the Night-Time Knee Symptom?</text><text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">Location can guide questions, but it cannot diagnose the cause by itself.</text><rect x="400" y="180" width="400" height="430" rx="30" fill="#F8FAFC" stroke="#CBD5E1"/><path d="M560 225 C530 300 525 350 545 420 C560 470 555 525 530 575" stroke="#E2B38E" stroke-width="92" fill="none" stroke-linecap="round"/><path d="M640 225 C670 300 675 350 655 420 C640 470 645 525 670 575" stroke="#E2B38E" stroke-width="92" fill="none" stroke-linecap="round"/><ellipse cx="600" cy="410" rx="82" ry="68" fill="white" stroke="#0F172A" stroke-width="5"/><circle cx="600" cy="380" r="23" fill="#2563EB" fill-opacity=".85"/><path d="M600 380 L110 250" stroke="#2563EB" stroke-width="4"/><text x="110" y="245" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#2563EB">Front</text><text x="110" y="275" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Kneecap, quadriceps tendon,</text><text x="110" y="298" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">patellar tendon</text><circle cx="555" cy="420" r="23" fill="#EA580C" fill-opacity=".85"/><path d="M555 420 L115 420" stroke="#EA580C" stroke-width="4"/><text x="115" y="415" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#EA580C">Inner</text><text x="115" y="445" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Joint line, medial soft tissues,</text><text x="115" y="468" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">pes anserine area</text><circle cx="645" cy="420" r="23" fill="#0F766E" fill-opacity=".85"/><path d="M645 420 L925 420" stroke="#0F766E" stroke-width="4"/><text x="945" y="415" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F766E">Outer</text><text x="945" y="445" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">IT band area, lateral joint line,</text><text x="945" y="468" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">surrounding soft tissues</text><circle cx="600" cy="455" r="23" fill="#7C3AED" fill-opacity=".85"/><path d="M600 455 L940 250" stroke="#7C3AED" stroke-width="4"/><text x="960" y="245" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#7C3AED">Back</text><text x="960" y="275" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Hamstring or calf tendons,</text><text x="960" y="298" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">popliteal area, swelling</text><rect x="170" y="640" width="860" height="56" rx="20" fill="#FFF7ED" stroke="#FED7AA"/><text x="600" y="675" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#EA580C">The same location can have several causes. Use symptoms, examination, and history together.</text></svg>