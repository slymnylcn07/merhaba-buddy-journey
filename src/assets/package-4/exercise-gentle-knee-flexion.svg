<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Gentle Knee Flexion and Extension</title><desc id="desc">Move only through a comfortable range. This is a mobility illustration, not a diagnosis.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Gentle Knee Flexion and Extension</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">Move only through a comfortable range. This is a mobility illustration, not a diagnosis.</text>
<rect x="80" y="160" width="490" height="470" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="104" y="202" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Start: leg relaxed</text><rect x="630" y="160" width="490" height="470" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="654" y="202" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Bend: slide the heel toward you</text><rect x="140" y="470" width="380" height="26" rx="13" fill="#CBD5E1"/><circle cx="210" cy="300" r="27" fill="#F0C7A5" stroke="#0F172A" stroke-width="5"/><path d="M235 320 L335 440" stroke="#0F172A" stroke-width="18" stroke-linecap="round"/><path d="M335 440 L480 468" stroke="#0F172A" stroke-width="18" stroke-linecap="round"/><path d="M470 468 L520 468" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/><rect x="690" y="470" width="380" height="26" rx="13" fill="#CBD5E1"/><circle cx="760" cy="300" r="27" fill="#F0C7A5" stroke="#0F172A" stroke-width="5"/><path d="M785 320 L885 440" stroke="#0F172A" stroke-width="18" stroke-linecap="round"/><path d="M885 440 L955 365 L1025 468" stroke="#0F172A" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1008 468 L1058 468" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/><path d="M1045 540 Q975 525 945 455" stroke="#2563EB" stroke-width="8" fill="none" marker-end="url(#arrow)"/><path d="M560 395 L630 395" stroke="#2563EB" stroke-width="9" marker-end="url(#arrow)"/><rect x="165" y="650" width="870" height="62" rx="22" fill="#ECFDF5" stroke="#A7F3D0"/><text x="600" y="689" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#0F766E">Stop and seek advice if movement causes sharp pain, locking, or giving way.</text></svg>