<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Seated Knee Extension</title><desc id="desc">A controlled quadriceps exercise performed from a sturdy chair.</desc>
