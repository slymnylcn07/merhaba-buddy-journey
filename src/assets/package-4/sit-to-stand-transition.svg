<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Chair-Supported Sit-to-Stand</title><desc id="desc">A functional strengthening option when it is comfortable and appropriate for you.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Chair-Supported Sit-to-Stand</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">A functional strengthening option when it is comfortable and appropriate for you.</text>
<rect x="80" y="160" width="490" height="470" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="104" y="202" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Start: sit near the front of the chair</text><rect x="630" y="160" width="490" height="470" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="654" y="202" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Stand: lean forward and push through the feet</text><rect x="230" y="395" width="200" height="18" rx="9" fill="#475569"/><path d="M255 413 L255 565 M405 413 L405 565" stroke="#475569" stroke-width="11"/><circle cx="330" cy="245" r="25" fill="#F0C7A5" stroke="#0F172A" stroke-width="5"/><path d="M330 275 L340 392" stroke="#0F172A" stroke-width="18"/><path d="M340 392 L285 480 L295 560 M340 392 L395 480 L385 560" stroke="#0F172A" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M275 560 L325 560 M365 560 L415 560" stroke="#2563EB" stroke-width="13" stroke-linecap="round"/><circle cx="870" cy="269.8" r="28" fill="#F0C7A5" stroke="#0F172A" stroke-width="5"/><path d="M870 299.8 L870 413.3" stroke="#0F172A" stroke-width="18" stroke-linecap="round"/><path d="M870 331.3 L812.6 384.6" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/><path d="M870 413.3 L847.04 536.3 L833.1 565" stroke="#0F172A" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M870 413.3 L898.7 536.3 L915.1 565" stroke="#0F172A" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M817.52 565 L855.24 565" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/><path d="M898.7 565 L937.24 565" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/><path d="M520 510 Q600 430 660 350" stroke="#2563EB" stroke-width="9" fill="none" marker-end="url(#arrow)"/><rect x="175" y="650" width="850" height="62" rx="22" fill="#ECFDF5" stroke="#A7F3D0"/><text x="600" y="689" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#0F766E">Use the armrests or a stable support if needed; control the return to sitting.</text></svg>