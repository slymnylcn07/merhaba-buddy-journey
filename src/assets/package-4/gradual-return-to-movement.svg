<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">A Gradual Return to Movement After Rest</title><desc id="desc">Start gently, reassess, and increase only if the knee feels comfortable.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">A Gradual Return to Movement After Rest</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">Start gently, reassess, and increase only if the knee feels comfortable.</text>
<rect x="65" y="190" width="230" height="390" rx="28" fill="white" stroke="#EA580C" stroke-width="3"/><circle cx="110" cy="240" r="27" fill="#EA580C"/><text x="110" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="white">1</text><text x="89" y="320" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Pause and check</text><text x="89" y="365" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Notice swelling, sharp</text><text x="89" y="392" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">pain, locking, or</text><text x="89" y="419" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">instability</text><path d="M303 385 L335 385" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow)"/><rect x="345" y="190" width="230" height="390" rx="28" fill="white" stroke="#2563EB" stroke-width="3"/><circle cx="390" cy="240" r="27" fill="#2563EB"/><text x="390" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="white">2</text><text x="369" y="320" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Small movements</text><text x="369" y="365" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Try ankle pumps or a</text><text x="369" y="392" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">comfortable knee bend</text><path d="M583 385 L615 385" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow)"/><rect x="625" y="190" width="230" height="390" rx="28" fill="white" stroke="#7C3AED" stroke-width="3"/><circle cx="670" cy="240" r="27" fill="#7C3AED"/><text x="670" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="white">3</text><text x="649" y="320" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Stand with support</text><text x="649" y="365" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Use a chair or counter if</text><text x="649" y="392" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">helpful</text><path d="M863 385 L895 385" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow)"/><rect x="905" y="190" width="230" height="390" rx="28" fill="white" stroke="#0F766E" stroke-width="3"/><circle cx="950" cy="240" r="27" fill="#0F766E"/><text x="950" y="249" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="white">4</text><text x="929" y="320" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F172A">Short easy walk</text><text x="929" y="365" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Reassess how the knee</text><text x="929" y="392" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">responds</text><text x="600" y="680" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">This is a comfort routine, not a treatment plan. Follow individual medical or rehabilitation advice.</text></svg>