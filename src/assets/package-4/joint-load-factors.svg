<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">What Influences Knee Joint Load?</title><desc id="desc">Body mass is one factor; movement, speed, terrain, technique, and strength also matter.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">What Influences Knee Joint Load?</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">Body mass is one factor; movement, speed, terrain, technique, and strength also matter.</text>
<rect x="80" y="175" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><rect x="108" y="203" width="64" height="64" rx="18" fill="#2563EB"/><path d="M124 237 L138 251 L160 220" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="238" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Body mass</text><text x="200" y="276" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Changes the amount of force the legs manage</text><rect x="620" y="175" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><rect x="648" y="203" width="64" height="64" rx="18" fill="#EA580C"/><path d="M664 237 L678 251 L700 220" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="740" y="238" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Activity</text><text x="740" y="276" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Walking, stairs, running, and jumping differ</text><rect x="80" y="420" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><rect x="108" y="448" width="64" height="64" rx="18" fill="#0F766E"/><path d="M124 482 L138 496 L160 465" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="483" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Movement strategy</text><text x="200" y="521" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Speed, step length, and technique affect demand</text><rect x="620" y="420" width="500" height="190" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><rect x="648" y="448" width="64" height="64" rx="18" fill="#7C3AED"/><path d="M664 482 L678 496 L700 465" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="740" y="483" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Capacity and recovery</text><text x="740" y="521" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Strength, conditioning, sleep, and pacing</text><text x="740" y="546" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">influence tolerance</text><text x="600" y="685" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">The goal is not to blame body size. A gradual, sustainable plan can focus on comfort, capacity, and overall health.</text></svg>