<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Low-Impact Movement Options</title><desc id="desc">Examples often used to build strength and mobility with less impact.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Low-Impact Movement Options</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">Examples often used to build strength and mobility with less impact.</text>
<rect x="80" y="175" width="280" height="430" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="220" cy="315" r="82" fill="white" stroke="#2563EB" stroke-width="6"/><circle cx="205" cy="270" r="18" fill="#F0C7A5"/><path d="M205 290 L212 350 L175 405 M212 350 L258 405 M208 315 L162 350 M208 315 L255 335" stroke="#0F172A" stroke-width="12" fill="none" stroke-linecap="round"/><text x="220" y="500" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F172A">Level walking</text><text x="220" y="535" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Short, comfortable walks on an</text><text x="220" y="560" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">even surface</text><rect x="410" y="175" width="280" height="430" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="550" cy="315" r="82" fill="white" stroke="#0F766E" stroke-width="6"/><circle cx="515" cy="370" r="38" fill="none" stroke="#0F172A" stroke-width="8"/><circle cx="595" cy="370" r="38" fill="none" stroke="#0F172A" stroke-width="8"/><path d="M515 370 L555 315 L595 370 L545 370 Z M555 315 L575 285" stroke="#0F766E" stroke-width="8" fill="none"/><circle cx="555" cy="245" r="17" fill="#F0C7A5"/><path d="M555 263 L555 315 L525 350 M555 315 L595 350 M555 285 L590 290" stroke="#0F172A" stroke-width="10" fill="none" stroke-linecap="round"/><text x="550" y="500" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F172A">Stationary cycling</text><text x="550" y="535" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Low resistance and a</text><text x="550" y="560" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">comfortable seat height</text><rect x="740" y="175" width="280" height="430" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="880" cy="315" r="82" fill="white" stroke="#EA580C" stroke-width="6"/><rect x="812" y="355" width="135" height="18" rx="9" fill="#475569"/><path d="M835 373 L835 425 M925 373 L925 425" stroke="#475569" stroke-width="10"/><circle cx="880" cy="250" r="18" fill="#F0C7A5"/><path d="M880 270 L880 345 M880 305 L835 335 M880 345 L845 425 M880 345 L925 425" stroke="#0F172A" stroke-width="12" fill="none" stroke-linecap="round"/><text x="880" y="500" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F172A">Chair-supported exercise</text><text x="880" y="535" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Sit-to-stand or leg extension</text><text x="880" y="560" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">with support</text><text x="600" y="680" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">Choose a level that feels manageable and follow advice from your clinician or physical therapist when needed.</text></svg>