<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Why the First Steps After Rest May Feel Stiff</title><desc id="desc">Several non-specific factors can overlap; the experience varies from person to person.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EFF6FF"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="692" rx="34" fill="white" stroke="#CBD5E1" filter="url(#shadow)"/>
<text x="70" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Why the First Steps After Rest May Feel Stiff</text>
<text x="70" y="128" font-family="Inter,Arial,sans-serif" font-size="19" fill="#475569">Several non-specific factors can overlap; the experience varies from person to person.</text>
<rect x="80" y="190" width="280" height="370" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="135" cy="245" r="28" fill="#2563EB"/><text x="135" y="254" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="white">1</text><text x="110" y="320" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Sustained position</text><text x="110" y="365" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">The knee stays bent or still</text><text x="110" y="394" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">for a while</text><path d="M366 375 L400 375" stroke="#2563EB" stroke-width="7" marker-end="url(#arrow)"/><rect x="410" y="190" width="280" height="370" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="465" cy="245" r="28" fill="#EA580C"/><text x="465" y="254" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="white">2</text><text x="440" y="320" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">First movement</text><text x="440" y="365" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">Muscles and the joint</text><text x="440" y="394" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">transition back to activity</text><path d="M696 375 L730 375" stroke="#2563EB" stroke-width="7" marker-end="url(#arrow)"/><rect x="740" y="190" width="280" height="370" rx="28" fill="#F8FAFC" stroke="#CBD5E1"/><circle cx="795" cy="245" r="28" fill="#0F766E"/><text x="795" y="254" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="white">3</text><text x="770" y="320" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#0F172A">Gentle warm-up</text><text x="770" y="365" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">A few comfortable movements</text><text x="770" y="394" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475569">may make motion feel easier</text><rect x="190" y="610" width="820" height="72" rx="24" fill="#FFF7ED" stroke="#FED7AA"/><text x="600" y="640" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#EA580C">This pattern is common but not diagnostic.</text><text x="600" y="666" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Pain that is severe, persistent, swollen, locked, or associated with injury should be assessed.</text></svg>