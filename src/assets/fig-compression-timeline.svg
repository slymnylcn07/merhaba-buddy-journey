<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#F8FAFC"/>
  <text x="500" y="48" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#0F172A">A typical 15-minute compression session</text>
  <line x1="90" y1="230" x2="910" y2="230" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <circle cx="140" cy="230" r="16" fill="#3B82F6"/>
    <text x="140" y="180" text-anchor="middle" font-size="19" font-weight="bold" fill="#1E3A8A">Min 0-2</text>
    <text x="140" y="285" text-anchor="middle" font-size="16" fill="#475569">Gentle warm-up</text>
    <text x="140" y="306" text-anchor="middle" font-size="16" fill="#475569">inflation</text>
    <circle cx="380" cy="230" r="16" fill="#2563EB"/>
    <text x="380" y="180" text-anchor="middle" font-size="19" font-weight="bold" fill="#1E3A8A">Min 2-6</text>
    <text x="380" y="285" text-anchor="middle" font-size="16" fill="#475569">Rhythmic squeeze</text>
    <text x="380" y="306" text-anchor="middle" font-size="16" fill="#475569">and release begins</text>
    <circle cx="620" cy="230" r="16" fill="#1D4ED8"/>
    <text x="620" y="180" text-anchor="middle" font-size="19" font-weight="bold" fill="#1E3A8A">Min 6-12</text>
    <text x="620" y="285" text-anchor="middle" font-size="16" fill="#475569">Full-cycle waves,</text>
    <text x="620" y="306" text-anchor="middle" font-size="16" fill="#475569">legs feel lighter</text>
    <circle cx="860" cy="230" r="16" fill="#22C55E"/>
    <text x="860" y="180" text-anchor="middle" font-size="19" font-weight="bold" fill="#166534">Min 12-15</text>
    <text x="860" y="285" text-anchor="middle" font-size="16" fill="#475569">Wind-down and</text>
    <text x="860" y="306" text-anchor="middle" font-size="16" fill="#475569">gentle deflation</text>
  </g>
  <text x="500" y="385" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#64748B" font-style="italic">Exact cycle patterns vary by device mode and intensity setting</text>
</svg>
