<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
  <rect width="1000" height="520" fill="#FFFFFF"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#0F172A">How joint cartilage changes over time</text>
  <text x="500" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B">A simplified view. Change is gradual and not the same for everyone.</text>

  <!-- STAGE 1: healthy -->
  <g transform="translate(60,110)">
    <text x="120" y="0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#166534">Healthy cartilage</text>
    <path d="M60 40 C 100 36 150 36 190 40 L 186 130 L 64 130 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
    <path d="M64 150 C 110 144 140 144 186 150 L 182 250 L 68 250 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
    <path d="M60 135 C 110 128 140 128 190 135 L 188 146 C 140 140 110 140 62 146 Z" fill="#22C55E"/>
    <rect x="62" y="146" width="126" height="6" fill="#7DD3FC"/>
    <text x="120" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Smooth, thick cushion.</text>
    <text x="120" y="310" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Glides quietly.</text>
  </g>

  <!-- STAGE 2: moderate -->
  <g transform="translate(390,110)">
    <text x="120" y="0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#B45309">Moderate wear</text>
    <path d="M60 40 C 100 36 150 36 190 40 L 186 130 L 64 130 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
    <path d="M64 154 C 110 148 140 148 186 154 L 182 250 L 68 250 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
    <path d="M60 135 C 110 130 140 132 190 136 L 188 144 C 140 141 110 140 62 144 Z" fill="#F59E0B"/>
    <text x="120" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Thinner, less even.</text>
    <text x="120" y="310" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">May feel stiff at times.</text>
  </g>

  <!-- STAGE 3: advanced -->
  <g transform="translate(720,110)">
    <text x="120" y="0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#B91C1C">Advanced wear</text>
    <path d="M60 40 C 100 36 150 36 190 40 L 186 130 L 64 130 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
    <path d="M64 158 C 110 152 140 152 186 158 L 182 250 L 68 250 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
    <path d="M92 136 l40 0 M150 137 l24 0" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
    <text x="120" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Cushion is largely gone.</text>
    <text x="120" y="310" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Bone contacts bone.</text>
  </g>

  <text x="500" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B" font-style="italic">Only a clinician can assess a real joint. This is an illustration, not a diagnosis.</text>
</svg>
