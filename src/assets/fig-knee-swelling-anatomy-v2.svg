<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <rect width="1000" height="620" fill="#FFFFFF"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Where swelling collects inside the knee</text>

  <!-- NORMAL -->
  <text x="270" y="90" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#166534">Normal fluid level</text>
  <path d="M220 120 C 280 116 320 130 324 180 L 328 280 L 212 280 L 212 180 C 212 130 220 120 220 120 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
  <ellipse cx="242" cy="312" rx="40" ry="36" fill="#E7E5E4" stroke="#A8A29E" stroke-width="3"/>
  <ellipse cx="300" cy="312" rx="38" ry="36" fill="#E7E5E4" stroke="#A8A29E" stroke-width="3"/>
  <ellipse cx="270" cy="300" rx="30" ry="40" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <path d="M204 350 C 240 340 300 340 336 350" stroke="#38BDF8" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="270" cy="330" rx="66" ry="16" fill="#93C5FD" opacity="0.5"/>
  <path d="M226 390 C 268 382 310 390 314 420 L 312 560 L 232 560 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
  <text x="270" y="596" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#475569">A thin layer of fluid lubricates the joint</text>

  <line x1="500" y1="110" x2="500" y2="560" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- SWOLLEN -->
  <text x="730" y="90" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#B91C1C">Swollen after exercise</text>
  <path d="M680 120 C 740 116 780 130 784 180 L 788 280 L 672 280 L 672 180 C 672 130 680 120 680 120 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
  <ellipse cx="702" cy="312" rx="40" ry="36" fill="#E7E5E4" stroke="#A8A29E" stroke-width="3"/>
  <ellipse cx="760" cy="312" rx="38" ry="36" fill="#E7E5E4" stroke="#A8A29E" stroke-width="3"/>
  <ellipse cx="730" cy="300" rx="30" ry="40" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <!-- expanded fluid -->
  <ellipse cx="730" cy="330" rx="96" ry="46" fill="#3B82F6" opacity="0.4"/>
  <ellipse cx="730" cy="252" rx="52" ry="24" fill="#3B82F6" opacity="0.35"/>
  <path d="M664 350 C 700 340 760 340 796 350" stroke="#38BDF8" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M686 390 C 728 382 770 390 774 420 L 772 560 L 692 560 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
  <text x="880" y="250" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1D4ED8">Extra fluid</text>
  <text x="880" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">fills the space</text>
  <text x="880" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">above the kneecap</text>
  <line x1="872" y1="252" x2="782" y2="256" stroke="#93C5FD" stroke-width="2"/>
  <text x="730" y="596" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#475569">The joint feels tight, warm and harder to bend</text>

  <!-- labels for normal side, each used ONCE -->
  <g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#44403C">
    <text x="60" y="180">Femur</text>
    <line x1="110" y1="174" x2="214" y2="200" stroke="#A8A29E" stroke-width="2"/>
    <text x="60" y="300">Patella</text>
    <line x1="118" y1="294" x2="242" y2="300" stroke="#FBBF24" stroke-width="2"/>
    <text x="60" y="352">Joint fluid</text>
    <line x1="130" y1="346" x2="206" y2="340" stroke="#93C5FD" stroke-width="2"/>
    <text x="60" y="440">Tibia</text>
    <line x1="106" y1="434" x2="230" y2="430" stroke="#A8A29E" stroke-width="2"/>
  </g>
</svg>
