<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
<title id="t">Choosing between a sleeve and a brace</title><desc id="d">A decision path based on symptoms.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient></defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<text x="70" y="100" font-family="Inter,Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#020617">Start with the symptom, not the product</text>
<rect x="430" y="160" width="540" height="110" rx="18" fill="#0f172a"/>
<text x="700" y="205" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#ffffff">Does the knee ever give way,</text>
<text x="700" y="242" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#ffffff">lock, or feel unstable?</text>
<path d="M560 276 L360 330" stroke="#94a3b8" stroke-width="5"/><path d="M840 276 L1040 330" stroke="#94a3b8" stroke-width="5"/>
<text x="430" y="316" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#b91c1c">YES</text>
<text x="940" y="316" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#059669">NO</text>
<rect x="90" y="340" width="540" height="150" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="3"/>
<text x="130" y="392" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#b91c1c">See a clinician first</text>
<text x="130" y="432" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#7f1d1d">Instability usually means a ligament or meniscus</text>
<text x="130" y="466" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#7f1d1d">problem. A brace should be chosen with advice.</text>
<rect x="770" y="340" width="540" height="150" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="3"/>
<text x="810" y="392" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#047857">Start with a sleeve</text>
<text x="810" y="432" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#065f46">Cheapest, least restrictive, easiest to wear all</text>
<text x="810" y="466" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#065f46">day. Give it two weeks of honest use.</text>
<rect x="90" y="540" width="1220" height="280" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
<text x="132" y="596" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#020617">Then match the detail</text>

<circle cx="152" cy="648" r="8" fill="#2563eb"/>
<text x="180" y="656" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#334155">Pain right under the kneecap when climbing or kneeling, plus swelling: try a wraparound with an open kneecap.</text>

<circle cx="152" cy="702" r="8" fill="#2563eb"/>
<text x="180" y="710" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#334155">A sharp point of pain just below the kneecap during jumping or running: a single strap often beats a full sleeve.</text>

<circle cx="152" cy="756" r="8" fill="#2563eb"/>
<text x="180" y="764" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#334155">Morning stiffness and general arthritis ache: a plain sleeve, worn for the stiff hours rather than all day.</text>

<circle cx="152" cy="810" r="8" fill="#2563eb"/>
<text x="180" y="818" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#334155">Swelling that changes through the day: adjustable straps let you retune pressure instead of buying two sizes.</text>

</svg>