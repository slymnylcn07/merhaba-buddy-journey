<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Menopause knee pain action plan</title><desc id="desc">A practical four-pillar action plan and red flags for knee pain in midlife.</desc>
<rect width="1400" height="900" rx="44" fill="#f8fafc"/>
<text x="700" y="85" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#0f172a">Build the plan around function, not hormones alone</text>
<g font-family="Arial">
 <g transform="translate(70 165)"><rect width="285" height="330" rx="34" fill="#ede9fe"/><circle cx="142" cy="80" r="48" fill="#7c3aed"/><path d="M112 82h60M142 52v60" stroke="#fff" stroke-width="10" stroke-linecap="round"/><text x="142" y="175" text-anchor="middle" font-size="31" font-weight="700" fill="#0f172a">Strength</text><text x="142" y="225" text-anchor="middle" font-size="24" fill="#475569">Quadriceps, hips, calves</text><text x="142" y="263" text-anchor="middle" font-size="24" fill="#475569">2–3 times weekly</text><text x="142" y="301" text-anchor="middle" font-size="24" fill="#475569">Progress gradually</text></g>
 <g transform="translate(395 165)"><rect width="285" height="330" rx="34" fill="#fce7f3"/><circle cx="142" cy="80" r="48" fill="#db2777"/><path d="M105 85c28-45 76-45 78 0-20-12-59-12-78 0Z" fill="#fff"/><text x="142" y="175" text-anchor="middle" font-size="31" font-weight="700" fill="#0f172a">Sleep</text><text x="142" y="225" text-anchor="middle" font-size="24" fill="#475569">Treat hot flashes</text><text x="142" y="263" text-anchor="middle" font-size="24" fill="#475569">Consistent schedule</text><text x="142" y="301" text-anchor="middle" font-size="24" fill="#475569">Address insomnia</text></g>
 <g transform="translate(720 165)"><rect width="285" height="330" rx="34" fill="#dbeafe"/><circle cx="142" cy="80" r="48" fill="#2563eb"/><path d="M110 100c15-55 52-55 65 0" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/><text x="142" y="175" text-anchor="middle" font-size="31" font-weight="700" fill="#0f172a">Daily load</text><text x="142" y="225" text-anchor="middle" font-size="24" fill="#475569">Walking and stairs</text><text x="142" y="263" text-anchor="middle" font-size="24" fill="#475569">Pacing during flares</text><text x="142" y="301" text-anchor="middle" font-size="24" fill="#475569">Keep moving safely</text></g>
 <g transform="translate(1045 165)"><rect width="285" height="330" rx="34" fill="#ccfbf1"/><circle cx="142" cy="80" r="48" fill="#0f766e"/><path d="M112 82h60M142 52v60" stroke="#fff" stroke-width="10" stroke-linecap="round"/><text x="142" y="175" text-anchor="middle" font-size="31" font-weight="700" fill="#0f172a">Clinical review</text><text x="142" y="225" text-anchor="middle" font-size="24" fill="#475569">Confirm the cause</text><text x="142" y="263" text-anchor="middle" font-size="24" fill="#475569">Discuss menopause care</text><text x="142" y="301" text-anchor="middle" font-size="24" fill="#475569">Review medicines</text></g>
 <g transform="translate(160 585)"><rect width="1080" height="210" rx="34" fill="#fff" stroke="#fecaca" stroke-width="5"/><text x="540" y="65" text-anchor="middle" font-size="34" font-weight="700" fill="#991b1b">Do not assume every new symptom is “just menopause”</text><text x="540" y="115" text-anchor="middle" font-size="26" fill="#475569">Urgent review: a hot swollen knee, fever, inability to bear weight, major trauma,</text><text x="540" y="155" text-anchor="middle" font-size="26" fill="#475569">a locked knee, or new one-sided calf swelling with chest pain or breathlessness.</text></g>
</g>
</svg>
