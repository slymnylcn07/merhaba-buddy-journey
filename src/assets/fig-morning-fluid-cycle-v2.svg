<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <rect width="1000" height="500" fill="#F8FAFC"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Why knees feel stiff first thing in the morning</text>

  <!-- NIGHT -->
  <g transform="translate(120,90)">
    <rect x="0" y="0" width="230" height="300" rx="22" fill="#1E293B"/>
    <text x="115" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#E2E8F0">Overnight</text>
    <circle cx="115" cy="150" r="58" fill="#334155" stroke="#64748B" stroke-width="3"/>
    <ellipse cx="115" cy="150" rx="42" ry="30" fill="#3B82F6" opacity="0.55"/>
    <text x="115" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#DBEAFE">fluid settles</text>
    <text x="115" y="242" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#94A3B8">The knee barely moves,</text>
    <text x="115" y="264" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#94A3B8">so fluid thickens and pools.</text>
  </g>

  <path d="M370 240 L 430 240" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <path d="M430 240 l-16 -8 l0 16 Z" fill="#94A3B8"/>

  <!-- WAKING -->
  <g transform="translate(450,90)">
    <rect x="0" y="0" width="230" height="300" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="115" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#B45309">First steps</text>
    <circle cx="115" cy="150" r="58" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
    <g stroke="#DC2626" stroke-width="4" stroke-linecap="round">
      <path d="M78 118 l-14 -12 M152 118 l14 -12 M78 182 l-14 12 M152 182 l14 12"/>
    </g>
    <text x="115" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#92400E">stiff, tight</text>
    <text x="115" y="242" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">The joint resists the first</text>
    <text x="115" y="264" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">bends. This peaks at waking.</text>
  </g>

  <path d="M700 240 L 760 240" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <path d="M760 240 l-16 -8 l0 16 Z" fill="#94A3B8"/>

  <!-- AFTER MOVEMENT -->
  <g transform="translate(780,90)">
    <rect x="0" y="0" width="180" height="300" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="90" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#166534">After 20-30 min</text>
    <circle cx="90" cy="150" r="52" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
    <path d="M62 150 l20 20 l38 -42" stroke="#16A34A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="242" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">Movement warms and</text>
    <text x="90" y="264" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">thins the fluid again.</text>
  </g>

  <text x="500" y="466" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B" font-style="italic">Stiffness that lasts well past 30-45 minutes, or comes with swelling, is worth discussing with a clinician.</text>
</svg>
