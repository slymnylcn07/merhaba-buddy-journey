<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Red light therapy dose for knees</title><desc id="desc">A knee illuminated by red and near-infrared light beside a timer, calendar, and dose gauge.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset=".55" stop-color="#fff1f2"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><radialGradient id="glow"><stop stop-color="#ef4444" stop-opacity=".82"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient></defs>
<rect width="1600" height="900" rx="48" fill="url(#bg)"/>
<circle cx="520" cy="420" r="330" fill="url(#glow)"/>
<g transform="translate(250 120)">
 <path d="M245 65c-85 130-74 235-25 306 30 44 42 91 32 190" fill="none" stroke="#cbd5e1" stroke-width="82" stroke-linecap="round"/>
 <path d="M360 75c70 112 62 215 12 300-28 48-37 104-23 197" fill="none" stroke="#94a3b8" stroke-width="86" stroke-linecap="round"/>
 <ellipse cx="302" cy="366" rx="125" ry="82" fill="#fee2e2" stroke="#dc2626" stroke-width="10"/>
 <g fill="#ef4444"><circle cx="210" cy="315" r="15"/><circle cx="260" cy="286" r="15"/><circle cx="318" cy="280" r="15"/><circle cx="373" cy="300" r="15"/><circle cx="400" cy="350" r="15"/><circle cx="382" cy="405" r="15"/><circle cx="325" cy="435" r="15"/><circle cx="265" cy="430" r="15"/><circle cx="220" cy="395" r="15"/></g>
</g>
<g transform="translate(760 145)" font-family="Arial">
 <rect width="690" height="560" rx="44" fill="#fff" stroke="#e2e8f0" stroke-width="4"/>
 <g transform="translate(55 65)"><circle cx="95" cy="95" r="88" fill="#fee2e2"/><circle cx="95" cy="95" r="60" fill="none" stroke="#dc2626" stroke-width="10"/><path d="M95 95V52M95 95l45 20" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/><text x="95" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">TIME</text></g>
 <g transform="translate(250 65)"><rect x="10" y="15" width="170" height="160" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="7"/><path d="M10 62h170" stroke="#d97706" stroke-width="7"/><path d="M52 0v35M138 0v35" stroke="#d97706" stroke-width="12" stroke-linecap="round"/><circle cx="60" cy="102" r="9" fill="#d97706"/><circle cx="100" cy="102" r="9" fill="#d97706"/><circle cx="140" cy="102" r="9" fill="#d97706"/><text x="95" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">FREQUENCY</text></g>
 <g transform="translate(455 65)"><path d="M20 170a85 85 0 0 1 170 0" fill="none" stroke="#dbeafe" stroke-width="30"/><path d="M20 170a85 85 0 0 1 120-78" fill="none" stroke="#2563eb" stroke-width="30"/><path d="M105 170l55-70" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/><text x="105" y="220" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">IRRADIANCE</text></g>
 <rect x="55" y="355" width="580" height="140" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
 <text x="345" y="415" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">Dose = power density × time</text>
 <text x="345" y="463" text-anchor="middle" font-size="27" fill="#475569">Minutes alone do not describe the treatment.</text>
</g>
<text x="800" y="820" text-anchor="middle" font-family="Arial" font-size="54" font-weight="700" fill="#0f172a">How long and how often depends on the device</text>
