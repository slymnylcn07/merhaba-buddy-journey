<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Four rucking load variables</title>
  <desc id="desc">A diagram showing pack weight, distance, pace, and terrain as four variables to progress one at a time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <text x="70" y="80" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">Rucking load has four main dials</text>
  <text x="70" y="121" font-family="Arial, sans-serif" font-size="21" fill="#475569">Increase one variable, then observe the same day and next morning.</text>

  <g transform="translate(70 168)">
    <g>
      <rect width="240" height="302" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="120" cy="106" r="66" fill="#dcfce7" stroke="#4ade80" stroke-width="9"/>
      <path d="M120 106L154 69" stroke="#15803d" stroke-width="9" stroke-linecap="round"/>
      <circle cx="120" cy="106" r="12" fill="#15803d"/>
      <text x="120" y="201" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#0f172a">Pack weight</text>
      <text x="120" y="237" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#475569">Start lighter than you</text>
      <text x="120" y="261" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#475569">think you need.</text>
    </g>
    <g transform="translate(270)">
      <rect width="240" height="302" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="120" cy="106" r="66" fill="#dbeafe" stroke="#60a5fa" stroke-width="9"/>
      <path d="M120 106L146 63" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
      <circle cx="120" cy="106" r="12" fill="#1d4ed8"/>
      <text x="120" y="201" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#0f172a">Distance</text>
      <text x="120" y="237" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#475569">Minutes and miles both</text>
      <text x="120" y="261" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#475569">add repeated steps.</text>
    </g>
    <g transform="translate(540)">
      <rect width="240" height="302" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="120" cy="106" r="66" fill="#fef3c7" stroke="#fbbf24" stroke-width="9"/>
      <path d="M120 106L159 75" stroke="#b45309" stroke-width="9" stroke-linecap="round"/>
      <circle cx="120" cy="106" r="12" fill="#b45309"/>
      <text x="120" y="201" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#0f172a">Pace</text>
      <text x="120" y="237" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#475569">Faster walking changes</text>
      <text x="120" y="261" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#475569">impact and fatigue.</text>
    </g>
    <g transform="translate(810)">
      <rect width="240" height="302" rx="24" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="120" cy="106" r="66" fill="#fee2e2" stroke="#f87171" stroke-width="9"/>
      <path d="M120 106L151 66" stroke="#b91c1c" stroke-width="9" stroke-linecap="round"/>
      <circle cx="120" cy="106" r="12" fill="#b91c1c"/>
      <text x="120" y="201" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#0f172a">Terrain</text>
      <text x="120" y="237" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#475569">Hills and uneven ground</text>
      <text x="120" y="261" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#475569">change the task.</text>
    </g>
  </g>

  <g transform="translate(70 518)">
    <rect width="1060" height="118" rx="24" fill="#14532d"/>
    <text x="36" y="46" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">A useful progression is easy to explain</text>
    <text x="36" y="83" font-family="Arial, sans-serif" font-size="19" fill="#dcfce7">Keep three dials steady, turn one dial slightly, and repeat only if walking and next-day symptoms stay predictable.</text>
  </g>
</svg>
