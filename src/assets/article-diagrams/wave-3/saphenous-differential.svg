<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Inner knee pain pattern comparison</title>
  <desc id="desc">Comparison of nerve, tendon, bursa, and joint clues for medial knee symptoms.</desc>
  <rect width="900" height="520" rx="28" fill="#f8fafc"/>
  <text x="45" y="58" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">Inner-knee clues that change the next step</text>
  <g font-family="Arial">
    <rect x="45" y="100" width="390" height="150" rx="20" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
    <text x="75" y="145" fill="#0e7490" font-size="22" font-weight="700">Nerve pattern</text>
    <text x="75" y="182" fill="#334155" font-size="18">Burning, electric, numb, touch-sensitive</text>
    <text x="75" y="214" fill="#334155" font-size="18">May follow a narrow sensory strip</text>
    <rect x="465" y="100" width="390" height="150" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
    <text x="495" y="145" fill="#15803d" font-size="22" font-weight="700">Tendon or bursa pattern</text>
    <text x="495" y="182" fill="#334155" font-size="18">Focal tenderness with loading or pressure</text>
    <text x="495" y="214" fill="#334155" font-size="18">Often less numbness or skin sensitivity</text>
    <rect x="45" y="285" width="390" height="150" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <text x="75" y="330" fill="#b45309" font-size="22" font-weight="700">Joint pattern</text>
    <text x="75" y="367" fill="#334155" font-size="18">Swelling, stiffness, catching, load pain</text>
    <text x="75" y="399" fill="#334155" font-size="18">May be deeper and less skin-focused</text>
    <rect x="465" y="285" width="390" height="150" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
    <text x="495" y="330" fill="#be123c" font-size="22" font-weight="700">Urgent pattern</text>
    <text x="495" y="367" fill="#334155" font-size="18">New weakness, spreading numbness, hot joint</text>
    <text x="495" y="399" fill="#334155" font-size="18">Prompt clinical assessment</text>
  </g>
</svg>
