<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Factors that guide osteochondral lesion treatment</title>
  <desc id="desc">Five-factor diagram covering age, symptoms, lesion size, location, and stability.</desc>
  <rect width="900" height="520" rx="28" fill="#f8fafc"/>
  <text x="45" y="58" fill="#0f172a" font-family="Arial" font-size="28" font-weight="700">Treatment is matched to the lesion and the person</text>
  <circle cx="450" cy="280" r="92" fill="#0f766e"/>
  <text x="450" y="270" text-anchor="middle" fill="white" font-family="Arial" font-size="23" font-weight="700">Shared</text>
  <text x="450" y="302" text-anchor="middle" fill="white" font-family="Arial" font-size="23" font-weight="700">decision</text>
  <g font-family="Arial" font-size="19" font-weight="700" text-anchor="middle">
    <rect x="65" y="115" width="190" height="82" rx="20" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/><text x="160" y="165" fill="#0e7490">Age and growth</text>
    <rect x="645" y="115" width="190" height="82" rx="20" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/><text x="740" y="165" fill="#0e7490">Size and depth</text>
    <rect x="60" y="350" width="200" height="82" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="160" y="400" fill="#b45309">Symptoms and goals</text>
    <rect x="640" y="350" width="200" height="82" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="740" y="400" fill="#b45309">Location and load</text>
    <rect x="350" y="90" width="200" height="72" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/><text x="450" y="135" fill="#15803d">Fragment stability</text>
  </g>
  <g stroke="#64748b" stroke-width="4"><path d="M255 175 L375 235"/><path d="M645 175 L525 235"/><path d="M260 370 L375 325"/><path d="M640 370 L525 325"/><path d="M450 162 V188"/></g>
</svg>
