<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Trail running load progression</title>
  <desc id="desc">Four separate trail load variables for distance, descent, terrain difficulty, and speed, with guidance to change one at a time.</desc>
  <rect width="900" height="520" rx="28" fill="#07182d"/>
  <text x="46" y="56" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Mileage is only one part of trail load</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="94" width="190" height="260" rx="20" fill="#102a43" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="147" cy="145" r="32" fill="#0e7490"/>
    <path d="M125 145 H169 M147 123 V167" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round"/>
    <text x="147" y="207" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Distance</text>
    <text x="147" y="239" fill="#cbd5e1" font-size="16" text-anchor="middle">Total miles or time</text>
    <text x="147" y="265" fill="#cbd5e1" font-size="16" text-anchor="middle">including hiking</text>
    <path d="M92 310 H202" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <rect x="254" y="94" width="190" height="260" rx="20" fill="#102a43" stroke="#34d399" stroke-width="3"/>
    <circle cx="349" cy="145" r="32" fill="#047857"/>
    <path d="M330 128 L368 162 M368 128 L330 162" stroke="#d1fae5" stroke-width="6" stroke-linecap="round"/>
    <text x="349" y="207" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Descent</text>
    <text x="349" y="239" fill="#cbd5e1" font-size="16" text-anchor="middle">Elevation loss and</text>
    <text x="349" y="265" fill="#cbd5e1" font-size="16" text-anchor="middle">longest downhill</text>
    <path d="M294 310 H404" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
    <rect x="456" y="94" width="190" height="260" rx="20" fill="#102a43" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="551" cy="145" r="32" fill="#b45309"/>
    <circle cx="539" cy="151" r="7" fill="#fef3c7"/>
    <circle cx="559" cy="137" r="9" fill="#fef3c7"/>
    <circle cx="567" cy="158" r="6" fill="#fef3c7"/>
    <text x="551" y="207" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Terrain</text>
    <text x="551" y="239" fill="#cbd5e1" font-size="16" text-anchor="middle">Smooth, rocky, loose,</text>
    <text x="551" y="265" fill="#cbd5e1" font-size="16" text-anchor="middle">muddy or off-camber</text>
    <path d="M496 310 H606" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <rect x="658" y="94" width="190" height="260" rx="20" fill="#102a43" stroke="#f472b6" stroke-width="3"/>
    <circle cx="753" cy="145" r="32" fill="#be185d"/>
    <path d="M728 153 C744 127 762 127 778 153" fill="none" stroke="#fce7f3" stroke-width="6" stroke-linecap="round"/>
    <path d="M753 145 L770 132" stroke="#fce7f3" stroke-width="5" stroke-linecap="round"/>
    <text x="753" y="207" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Speed</text>
    <text x="753" y="239" fill="#cbd5e1" font-size="16" text-anchor="middle">Easy control, tempo,</text>
    <text x="753" y="265" fill="#cbd5e1" font-size="16" text-anchor="middle">race effort or fatigue</text>
    <path d="M698 310 H808" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
    <rect x="96" y="390" width="708" height="80" rx="22" fill="#0e7490"/>
    <text x="450" y="423" fill="#ecfeff" font-size="21" font-weight="700" text-anchor="middle">Progress one demanding variable at a time</text>
    <text x="450" y="450" fill="#cffafe" font-size="17" text-anchor="middle">Then check movement, swelling, later-day symptoms, and the next morning</text>
  </g>
</svg>
