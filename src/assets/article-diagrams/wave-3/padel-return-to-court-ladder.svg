<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Return to padel progression</title>
  <desc id="desc">Four-stage progression from comfortable daily movement to court drills, reduced games, and full matches.</desc>
  <rect width="900" height="520" rx="28" fill="#07182d"/>
  <text x="48" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Return to court by function, not only by time</text>
  <path d="M82 428 H265 V342 H448 V256 H631 V170 H818" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="326" width="190" height="116" rx="18" fill="#102a43" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="103" cy="360" r="19" fill="#38bdf8"/>
    <text x="103" y="367" fill="#07182d" font-size="19" font-weight="700" text-anchor="middle">1</text>
    <text x="132" y="358" fill="#f8fafc" font-size="19" font-weight="700">Daily movement</text>
    <text x="92" y="391" fill="#cbd5e1" font-size="15">Normal walk and stairs</text>
    <text x="92" y="415" fill="#cbd5e1" font-size="15">No meaningful swelling</text>
    <rect x="255" y="240" width="190" height="116" rx="18" fill="#102a43" stroke="#34d399" stroke-width="3"/>
    <circle cx="288" cy="274" r="19" fill="#34d399"/>
    <text x="288" y="281" fill="#07182d" font-size="19" font-weight="700" text-anchor="middle">2</text>
    <text x="317" y="272" fill="#f8fafc" font-size="19" font-weight="700">Planned motion</text>
    <text x="277" y="305" fill="#cbd5e1" font-size="15">Stops, steps and lunges</text>
    <text x="277" y="329" fill="#cbd5e1" font-size="15">Slow and controlled</text>
    <rect x="440" y="154" width="190" height="116" rx="18" fill="#102a43" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="473" cy="188" r="19" fill="#fbbf24"/>
    <text x="473" y="195" fill="#07182d" font-size="19" font-weight="700" text-anchor="middle">3</text>
    <text x="502" y="186" fill="#f8fafc" font-size="19" font-weight="700">Ball and drills</text>
    <text x="462" y="219" fill="#cbd5e1" font-size="15">Predictable feeds and rallies</text>
    <text x="462" y="243" fill="#cbd5e1" font-size="15">Short session, longer breaks</text>
    <rect x="625" y="68" width="205" height="116" rx="18" fill="#102a43" stroke="#f472b6" stroke-width="3"/>
    <circle cx="658" cy="102" r="19" fill="#f472b6"/>
    <text x="658" y="109" fill="#07182d" font-size="19" font-weight="700" text-anchor="middle">4</text>
    <text x="687" y="100" fill="#f8fafc" font-size="19" font-weight="700">Reduced game</text>
    <text x="647" y="133" fill="#cbd5e1" font-size="15">Time cap before full play</text>
    <text x="647" y="157" fill="#cbd5e1" font-size="15">Check the next morning</text>
    <rect x="70" y="464" width="760" height="35" rx="17" fill="#0e7490"/>
    <text x="450" y="488" fill="#ecfeff" font-size="16" font-weight="700" text-anchor="middle">If swelling, limping, locking, or giving way appears, stop and reassess</text>
  </g>
</svg>
