<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Banded terminal knee extension setup</title>
  <desc id="desc">A two-panel diagram shows the starting soft knee bend and the finishing straight knee position with the band anchored at knee height.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f2ff"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="68" y="74" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Banded TKE: from soft bend to controlled straight</text>
  <text x="68" y="111" font-family="Arial, sans-serif" font-size="18" fill="#475569">Keep the foot flat, the pelvis quiet, and the band centered behind the knee.</text>

  <g filter="url(#shadow)"><rect x="58" y="145" width="518" height="450" rx="28" fill="#fff"/><rect x="624" y="145" width="518" height="450" rx="28" fill="#fff"/></g>
  <text x="92" y="192" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">1  START</text>
  <text x="658" y="192" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2563eb">2  STRAIGHTEN</text>

  <g transform="translate(88 0)">
    <rect x="15" y="210" width="20" height="245" rx="8" fill="#334155"/>
    <circle cx="25" cy="332" r="13" fill="#0f766e"/>
    <path d="M35 332C130 332 176 336 235 350" fill="none" stroke="url(#band)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="282" cy="239" r="31" fill="#f2c9a5"/>
    <path d="M275 271L264 365" stroke="#172554" stroke-width="25" stroke-linecap="round"/>
    <path d="M264 310L218 367" stroke="#172554" stroke-width="15" stroke-linecap="round"/>
    <path d="M264 309L310 365" stroke="#172554" stroke-width="15" stroke-linecap="round"/>
    <path d="M264 365L236 450L257 527" fill="none" stroke="#2563eb" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M264 365L342 430L352 524" fill="none" stroke="#64748b" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M229 529H283" stroke="#0f172a" stroke-width="17" stroke-linecap="round"/>
    <path d="M338 529H392" stroke="#0f172a" stroke-width="17" stroke-linecap="round"/>
    <circle cx="236" cy="450" r="17" fill="#f59e0b"/>
    <path d="M237 350C248 393 246 421 236 450" fill="none" stroke="url(#band)" stroke-width="16" stroke-linecap="round"/>
    <path d="M310 401Q282 411 259 445" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="307" y="389" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">soft bend</text>
  </g>

  <g transform="translate(654 0)">
    <rect x="15" y="210" width="20" height="245" rx="8" fill="#334155"/>
    <circle cx="25" cy="332" r="13" fill="#0f766e"/>
    <path d="M35 332C126 332 180 337 238 355" fill="none" stroke="url(#band)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="282" cy="239" r="31" fill="#f2c9a5"/>
    <path d="M275 271L264 365" stroke="#172554" stroke-width="25" stroke-linecap="round"/>
    <path d="M264 310L218 367" stroke="#172554" stroke-width="15" stroke-linecap="round"/>
    <path d="M264 309L310 365" stroke="#172554" stroke-width="15" stroke-linecap="round"/>
    <path d="M264 365L246 448L255 527" fill="none" stroke="#2563eb" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M264 365L342 430L352 524" fill="none" stroke="#64748b" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M227 529H283" stroke="#0f172a" stroke-width="17" stroke-linecap="round"/>
    <path d="M338 529H392" stroke="#0f172a" stroke-width="17" stroke-linecap="round"/>
    <circle cx="246" cy="448" r="17" fill="#f59e0b"/>
    <path d="M240 355C250 392 250 421 246 448" fill="none" stroke="url(#band)" stroke-width="16" stroke-linecap="round"/>
    <path d="M204 428Q218 388 245 364" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="78" y="421" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">quad tightens</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
    <rect x="88" y="552" width="142" height="30" rx="15" fill="#ecfdf5"/><text x="106" y="573">band behind knee</text>
    <rect x="244" y="552" width="108" height="30" rx="15" fill="#eff6ff"/><text x="263" y="573">foot stays flat</text>
    <rect x="655" y="552" width="132" height="30" rx="15" fill="#eff6ff"/><text x="675" y="573">smooth pause</text>
    <rect x="802" y="552" width="188" height="30" rx="15" fill="#fff7ed"/><text x="822" y="573">no forced lockout</text>
  </g>
  <text x="600" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Use a fixed anchor and light resistance while learning the movement.</text>
</svg>
