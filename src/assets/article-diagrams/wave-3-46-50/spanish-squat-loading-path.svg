<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Spanish squat tendon loading pathway</title>
  <desc id="desc">A five-stage pathway moves from a shallow supported hold to longer isometrics, controlled repetitions, heavier resistance, and sport-specific energy storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f766e"/><stop offset=".52" stop-color="#2563eb"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="66" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">A Spanish squat is one step in tendon loading</text>
  <text x="66" y="109" font-family="Arial, sans-serif" font-size="18" fill="#475569">Build tolerance first, then strength, speed, and the demands of the actual sport.</text>
  <path d="M116 350C275 350 274 253 433 253S590 419 750 419S907 281 1084 281" fill="none" stroke="url(#line)" stroke-width="18" stroke-linecap="round" opacity=".28"/>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(70 260)"><rect width="192" height="180" rx="28" fill="#fff"/><circle cx="36" cy="36" r="22" fill="#0f766e"/><text x="36" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="24" y="82" font-size="19" font-weight="700" fill="#0f172a">SHALLOW HOLD</text><text x="24" y="112" font-size="15" fill="#475569">secure setup</text><text x="24" y="137" font-size="15" fill="#475569">short duration</text><text x="24" y="162" font-size="15" fill="#475569">stable response</text></g>
    <g transform="translate(286 163)"><rect width="192" height="180" rx="28" fill="#fff"/><circle cx="36" cy="36" r="22" fill="#168a93"/><text x="36" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="24" y="82" font-size="19" font-weight="700" fill="#0f172a">ISOMETRICS</text><text x="24" y="112" font-size="15" fill="#475569">longer holds</text><text x="24" y="137" font-size="15" fill="#475569">more sets or depth</text><text x="24" y="162" font-size="15" fill="#475569">one change at a time</text></g>
    <g transform="translate(504 329)"><rect width="192" height="180" rx="28" fill="#fff"/><circle cx="36" cy="36" r="22" fill="#2563eb"/><text x="36" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="24" y="82" font-size="19" font-weight="700" fill="#0f172a">SLOW REPS</text><text x="24" y="112" font-size="15" fill="#475569">lower with control</text><text x="24" y="137" font-size="15" fill="#475569">brief pause</text><text x="24" y="162" font-size="15" fill="#475569">steady rise</text></g>
    <g transform="translate(722 191)"><rect width="192" height="180" rx="28" fill="#fff"/><circle cx="36" cy="36" r="22" fill="#8b5cf6"/><text x="36" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text><text x="24" y="82" font-size="19" font-weight="700" fill="#0f172a">HEAVY SLOW</text><text x="24" y="112" font-size="15" fill="#475569">added resistance</text><text x="24" y="137" font-size="15" fill="#475569">larger movement</text><text x="24" y="162" font-size="15" fill="#475569">planned recovery</text></g>
    <g transform="translate(938 250)"><rect width="192" height="180" rx="28" fill="#fff"/><circle cx="36" cy="36" r="22" fill="#ea580c"/><text x="36" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">5</text><text x="24" y="82" font-size="19" font-weight="700" fill="#0f172a">SPORT LOAD</text><text x="24" y="112" font-size="15" fill="#475569">running and jumping</text><text x="24" y="137" font-size="15" fill="#475569">landing and direction</text><text x="24" y="162" font-size="15" fill="#475569">gradual return</text></g>
  </g>
  <rect x="130" y="565" width="940" height="50" rx="25" fill="#fff"/>
  <text x="600" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Advance when the current load is repeatable and the next-morning response is stable.</text>
  <text x="600" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">A clinician can adjust the sequence for diagnosis, season, surgery, and sport.</text>
</svg>
