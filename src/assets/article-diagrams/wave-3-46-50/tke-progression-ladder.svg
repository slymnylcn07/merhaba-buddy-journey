<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1500" role="img" aria-labelledby="title description">
  <title id="title">Five-step banded terminal knee extension progression</title>
  <desc id="description">A mobile-friendly vertical sequence that progresses control, repetitions, band tension, stance challenge, and integration into larger movements.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="720" height="1500" rx="32" fill="#f8fafc" />
  <rect width="720" height="150" rx="32" fill="url(#header)" />
  <text x="360" y="65" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">TKE Progression</text>
  <text x="360" y="111" text-anchor="middle" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="28">One change at a time</text>

  <path d="M92 285 V1265" fill="none" stroke="#bfdbfe" stroke-width="8" stroke-linecap="round" />

  <g filter="url(#shadow)">
    <rect x="40" y="180" width="640" height="210" rx="26" fill="#ffffff" stroke="#dbeafe" stroke-width="3" />
    <circle cx="92" cy="285" r="38" fill="#0f766e" />
    <text x="92" y="297" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">1</text>
    <text x="150" y="247" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">CONTROL</text>
    <text x="150" y="305" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">Light band + hand support</text>
    <text x="150" y="351" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">Same small motion each rep</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="420" width="640" height="210" rx="26" fill="#ffffff" stroke="#dbeafe" stroke-width="3" />
    <circle cx="92" cy="525" r="38" fill="#0f766e" />
    <text x="92" y="537" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">2</text>
    <text x="150" y="487" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">REPETITIONS</text>
    <text x="150" y="545" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">Add repetitions first</text>
    <text x="150" y="591" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">Keep the heel flat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="660" width="640" height="210" rx="26" fill="#ffffff" stroke="#dbeafe" stroke-width="3" />
    <circle cx="92" cy="765" r="38" fill="#2563eb" />
    <text x="92" y="777" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">3</text>
    <text x="150" y="727" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">BAND TENSION</text>
    <text x="150" y="785" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">Small resistance increase</text>
    <text x="150" y="831" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">No hip drive or knee snap</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="900" width="640" height="210" rx="26" fill="#ffffff" stroke="#dbeafe" stroke-width="3" />
    <circle cx="92" cy="1005" r="38" fill="#2563eb" />
    <text x="92" y="1017" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">4</text>
    <text x="150" y="967" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">STANCE</text>
    <text x="150" y="1025" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">Reduce support when stable</text>
    <text x="150" y="1071" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">Keep the quadriceps working</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="1140" width="640" height="210" rx="26" fill="#ffffff" stroke="#dbeafe" stroke-width="3" />
    <circle cx="92" cy="1245" r="38" fill="#7c3aed" />
    <text x="92" y="1257" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">5</text>
    <text x="150" y="1207" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">INTEGRATE</text>
    <text x="150" y="1265" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">Use it in squats or step-downs</text>
    <text x="150" y="1311" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="30">Then prepare running or sport</text>
  </g>

  <rect x="40" y="1390" width="640" height="74" rx="22" fill="#e0f2fe" />
  <text x="360" y="1438" text-anchor="middle" fill="#0c4a6e" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Check later today and tomorrow.</text>
</svg>
