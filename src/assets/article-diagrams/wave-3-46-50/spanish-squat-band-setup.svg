<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Spanish squat band setup</title>
  <desc id="desc">A side-view exercise diagram shows a secure anchor, broad band behind both knees, grounded feet, upright torso, and hips sitting backward.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf3"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ea580c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="66" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Spanish squat: secure the setup before loading</text>
  <text x="66" y="109" font-family="Arial, sans-serif" font-size="18" fill="#475569">The band supports the shins while the feet stay flat and the hips sit back.</text>
  <g filter="url(#shadow)"><rect x="58" y="143" width="1084" height="456" rx="30" fill="#fff"/></g>

  <g transform="translate(90 15)">
    <rect x="55" y="195" width="27" height="325" rx="9" fill="#334155"/>
    <path d="M31 206H106" stroke="#0f172a" stroke-width="17" stroke-linecap="round"/>
    <circle cx="69" cy="352" r="15" fill="#ea580c"/>
    <path d="M83 352C225 351 315 357 435 382" fill="none" stroke="url(#band)" stroke-width="22" stroke-linecap="round"/>
    <path d="M82 368C225 368 325 374 447 401" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" opacity=".7"/>

    <circle cx="641" cy="232" r="42" fill="#f2c9a5"/>
    <path d="M627 272L586 390" stroke="#172554" stroke-width="38" stroke-linecap="round"/>
    <path d="M615 310L523 365" stroke="#172554" stroke-width="19" stroke-linecap="round"/>
    <path d="M612 313L684 388" stroke="#172554" stroke-width="19" stroke-linecap="round"/>
    <path d="M586 390L445 399L446 510" fill="none" stroke="#2563eb" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M586 390L700 411L710 510" fill="none" stroke="#64748b" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M408 516H478" stroke="#0f172a" stroke-width="21" stroke-linecap="round"/>
    <path d="M672 516H748" stroke="#0f172a" stroke-width="21" stroke-linecap="round"/>
    <circle cx="445" cy="399" r="23" fill="#f59e0b"/>
    <path d="M432 382C440 388 444 392 445 399" stroke="#ea580c" stroke-width="22" stroke-linecap="round"/>

    <path d="M238 323H385" stroke="#ea580c" stroke-width="5" marker-end="url(#arrowOrange)"/>
    <text x="238" y="301" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ea580c">forward band pull</text>
    <path d="M567 322V226" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <text x="484" y="206" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">torso mostly upright</text>
    <path d="M567 410H655" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <text x="528" y="449" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">hips sit back</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
    <rect x="104" y="548" width="192" height="34" rx="17" fill="#fff7ed"/><text x="126" y="570">fixed knee-height anchor</text>
    <rect x="318" y="548" width="180" height="34" rx="17" fill="#fff7ed"/><text x="340" y="570">broad band, no roll</text>
    <rect x="520" y="548" width="140" height="34" rx="17" fill="#eff6ff"/><text x="543" y="570">steady breathing</text>
    <rect x="682" y="548" width="150" height="34" rx="17" fill="#eff6ff"/><text x="708" y="570">whole foot down</text>
    <rect x="854" y="548" width="224" height="34" rx="17" fill="#ecfdf5"/><text x="878" y="570">start above 90 degrees</text>
  </g>
  <text x="600" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Inspect the band and anchor before every set. Keep the face outside the recoil path.</text>
</svg>
