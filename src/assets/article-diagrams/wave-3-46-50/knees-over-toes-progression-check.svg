<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Four dials for progressing knees over toes exercises</title>
  <desc id="desc">A progression guide showing range, load, speed, and weekly dose, followed by a same-day and next-morning symptom check.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="64" y="70" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="750">Progress one knee-load dial at a time</text>
  <text x="64" y="108" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">More toe travel is not automatically better. Earn range through control and a stable response.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="56" y="150" width="250" height="246" rx="24" fill="#ffffff"/>
    <rect x="330" y="150" width="250" height="246" rx="24" fill="#ffffff"/>
    <rect x="604" y="150" width="250" height="246" rx="24" fill="#ffffff"/>
    <rect x="878" y="150" width="266" height="246" rx="24" fill="#ffffff"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <circle cx="181" cy="235" r="48" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <path d="M146 250C153 219 175 198 207 195" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <path d="M181 235L210 211" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <circle cx="181" cy="235" r="8" fill="#1d4ed8"/>
    <text x="181" y="313" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="750">Range</text>
    <text x="181" y="343" text-anchor="middle" fill="#64748b" font-size="15">shallow to deeper</text>
    <text x="181" y="368" text-anchor="middle" fill="#64748b" font-size="15">only when controlled</text>

    <circle cx="455" cy="235" r="48" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
    <path d="M425 219H485V252H425Z" fill="none" stroke="#16a34a" stroke-width="7" rx="4"/>
    <path d="M440 219V205H470V219" fill="none" stroke="#16a34a" stroke-width="7"/>
    <text x="455" y="313" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="750">Load</text>
    <text x="455" y="343" text-anchor="middle" fill="#64748b" font-size="15">support to bodyweight</text>
    <text x="455" y="368" text-anchor="middle" fill="#64748b" font-size="15">then external weight</text>

    <circle cx="729" cy="235" r="48" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
    <circle cx="729" cy="235" r="30" fill="none" stroke="#ea580c" stroke-width="7"/>
    <path d="M729 235L729 216M729 235L747 246" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
    <text x="729" y="313" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="750">Speed</text>
    <text x="729" y="343" text-anchor="middle" fill="#64748b" font-size="15">slow enough to own</text>
    <text x="729" y="368" text-anchor="middle" fill="#64748b" font-size="15">the reversal</text>

    <circle cx="1011" cy="235" r="48" fill="#faf5ff" stroke="#d8b4fe" stroke-width="3"/>
    <path d="M980 218H1042V260H980Z" fill="none" stroke="#9333ea" stroke-width="6" rx="4"/>
    <path d="M993 205V222M1029 205V222M981 232H1041" stroke="#9333ea" stroke-width="6" stroke-linecap="round"/>
    <text x="1011" y="313" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="750">Weekly dose</text>
    <text x="1011" y="343" text-anchor="middle" fill="#64748b" font-size="15">sets, repetitions</text>
    <text x="1011" y="368" text-anchor="middle" fill="#64748b" font-size="15">and frequency</text>
  </g>

  <path d="M307 273H322M581 273H596M855 273H870" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="56" y="430" width="1088" height="178" rx="26" fill="#ffffff"/>
  </g>
  <text x="88" y="472" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">The response check</text>
  <rect x="88" y="497" width="310" height="76" rx="18" fill="#ecfdf5"/>
  <circle cx="124" cy="535" r="17" fill="#16a34a"/>
  <path d="M116 535L122 541L133 528" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="154" y="527" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Stable</text>
  <text x="154" y="551" fill="#3f6212" font-family="Inter, Arial, sans-serif" font-size="14">control and next morning are normal</text>

  <rect x="445" y="497" width="310" height="76" rx="18" fill="#fffbeb"/>
  <circle cx="481" cy="535" r="17" fill="#d97706"/>
  <text x="481" y="542" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">!</text>
  <text x="511" y="527" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Borderline</text>
  <text x="511" y="551" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="14">repeat the same dose, do not add</text>

  <rect x="802" y="497" width="310" height="76" rx="18" fill="#fef2f2"/>
  <circle cx="838" cy="535" r="17" fill="#dc2626"/>
  <path d="M831 528L845 542M845 528L831 542" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="868" y="527" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Worse</text>
  <text x="868" y="551" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="14">reduce a dial or stop and assess</text>

  <text x="600" y="640" text-anchor="middle" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">Range, load, speed, and volume are separate variables. Change only one.</text>
</svg>
