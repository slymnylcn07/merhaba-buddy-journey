<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tibialis raise progression ladder</title>
  <desc id="desc">Four tibialis exercise levels from seated toe raises to wall raises, banded dorsiflexion, and carefully loaded dorsiflexion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
    <linearGradient id="step1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="step2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <linearGradient id="step3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="step4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="64" y="70" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="750">A tibialis progression is a ladder, not a race</text>
  <text x="64" y="108" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">Choose the lowest level that produces clean ankle motion and recoverable shin effort.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="58" y="418" width="250" height="146" rx="22" fill="url(#step1)"/>
    <rect x="328" y="334" width="250" height="230" rx="22" fill="url(#step2)"/>
    <rect x="598" y="250" width="250" height="314" rx="22" fill="url(#step3)"/>
    <rect x="868" y="166" width="274" height="398" rx="22" fill="url(#step4)"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <circle cx="94" cy="456" r="22" fill="#ffffff"/>
    <text x="94" y="464" text-anchor="middle" fill="#1d4ed8" font-size="19" font-weight="800">1</text>
    <text x="130" y="463" fill="#0f172a" font-size="21" font-weight="750">Seated toe raise</text>
    <text x="88" y="499" fill="#334155" font-size="15">Learn heel-down motion</text>
    <text x="88" y="526" fill="#334155" font-size="15">and a controlled return</text>

    <circle cx="364" cy="372" r="22" fill="#ffffff"/>
    <text x="364" y="380" text-anchor="middle" fill="#1d4ed8" font-size="19" font-weight="800">2</text>
    <text x="400" y="379" fill="#0f172a" font-size="21" font-weight="750">Wall tib raise</text>
    <text x="358" y="415" fill="#334155" font-size="15">Use body angle to scale</text>
    <text x="358" y="442" fill="#334155" font-size="15">the resistance gradually</text>
    <path d="M401 479L452 479L481 448" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <circle cx="401" cy="479" r="6" fill="#16a34a"/>

    <circle cx="634" cy="288" r="22" fill="#ffffff"/>
    <text x="634" y="296" text-anchor="middle" fill="#1d4ed8" font-size="19" font-weight="800">3</text>
    <text x="670" y="295" fill="#0f172a" font-size="21" font-weight="750">Banded pull</text>
    <text x="628" y="331" fill="#1e3a8a" font-size="15">Resistance stays specific</text>
    <text x="628" y="358" fill="#1e3a8a" font-size="15">to ankle dorsiflexion</text>
    <path d="M651 408C696 378 746 378 791 408" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <path d="M650 408L676 448L740 426" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="904" cy="204" r="22" fill="#ffffff"/>
    <text x="904" y="212" text-anchor="middle" fill="#1d4ed8" font-size="19" font-weight="800">4</text>
    <text x="940" y="211" fill="#ffffff" font-size="21" font-weight="750">Loaded option</text>
    <text x="898" y="247" fill="#dbeafe" font-size="15">Use only after high-rep</text>
    <text x="898" y="274" fill="#dbeafe" font-size="15">control is comfortable</text>
    <path d="M944 330H1055V395H944Z" fill="none" stroke="#ffffff" stroke-width="9" rx="8"/>
    <path d="M966 330V307H1033V330" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <text x="1000" y="438" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">tib bar or cable</text>
  </g>

  <rect x="58" y="592" width="1084" height="48" rx="24" fill="#0f172a"/>
  <text x="600" y="622" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750">Progress when the heel stays planted, both feet move evenly, and the next day remains normal.</text>
</svg>
