<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Step-down direction and load control map</title>
  <desc id="desc">A comparison of lateral and forward step-down directions with four adjustable controls: step height, free-foot reach, hand support, and lowering tempo.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07182d"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="34" fill="#f8fafc"/>
  <rect x="32" y="28" width="1136" height="102" rx="28" fill="url(#header)"/>
  <text x="70" y="73" fill="#f8fafc" font-family="Arial, sans-serif" font-size="31" font-weight="700">Choose the direction, then scale the demand</text>
  <text x="70" y="106" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="17">The same box height can feel different when the free foot moves beside or in front of the step.</text>

  <g font-family="Arial, sans-serif">
    <rect x="50" y="164" width="530" height="326" rx="28" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="84" y="207" fill="#065f46" font-size="24" font-weight="700">Lateral step-down</text>
    <text x="84" y="235" fill="#475569" font-size="16">Free heel lowers beside the platform</text>
    <rect x="103" y="388" width="314" height="42" rx="8" fill="#0f766e"/>
    <rect x="142" y="280" width="40" height="108" rx="18" fill="#1e293b"/>
    <circle cx="162" cy="262" r="25" fill="#f0b58e"/>
    <path d="M162 303 L231 345 L246 389" fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M162 304 L132 353 L125 388" fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M159 315 L107 338" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
    <path d="M249 388 V455" stroke="#0f766e" stroke-width="5" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
    <text x="272" y="454" fill="#065f46" font-size="15" font-weight="700">Light heel tap beside step</text>

    <rect x="620" y="164" width="530" height="326" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="654" y="207" fill="#1e3a8a" font-size="24" font-weight="700">Forward step-down</text>
    <text x="654" y="235" fill="#475569" font-size="16">Free heel reaches toward the floor in front</text>
    <rect x="665" y="388" width="314" height="42" rx="8" fill="#2563eb"/>
    <rect x="704" y="280" width="40" height="108" rx="18" fill="#1e293b"/>
    <circle cx="724" cy="262" r="25" fill="#9f6e4f"/>
    <path d="M724 303 L793 345 L807 389" fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M724 304 L690 350 L683 388" fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M722 316 L673 340" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <path d="M811 389 C858 414 895 438 935 462" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
    <text x="826" y="470" fill="#1e40af" font-size="15" font-weight="700">Reach forward without dropping</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="64" y="548" fill="#0f172a" font-size="21" font-weight="700">Four controls for either direction</text>
    <rect x="62" y="574" width="250" height="112" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="101" cy="612" r="22" fill="#14b8a6"/>
    <text x="101" y="619" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text>
    <text x="135" y="608" fill="#0f172a" font-size="18" font-weight="700">Step height</text>
    <text x="89" y="649" fill="#475569" font-size="15">Lower first, then earn depth.</text>

    <rect x="337" y="574" width="250" height="112" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="376" cy="612" r="22" fill="#2563eb"/>
    <text x="376" y="619" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text>
    <text x="410" y="608" fill="#0f172a" font-size="18" font-weight="700">Free-foot reach</text>
    <text x="364" y="649" fill="#475569" font-size="15">A light tap, not a push-off.</text>

    <rect x="612" y="574" width="250" height="112" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="651" cy="612" r="22" fill="#f59e0b"/>
    <text x="651" y="619" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text>
    <text x="685" y="608" fill="#0f172a" font-size="18" font-weight="700">Hand support</text>
    <text x="639" y="649" fill="#475569" font-size="15">Use enough to stay safe.</text>

    <rect x="887" y="574" width="250" height="112" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="926" cy="612" r="22" fill="#db2777"/>
    <text x="926" y="619" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4</text>
    <text x="960" y="608" fill="#0f172a" font-size="18" font-weight="700">Lowering tempo</text>
    <text x="914" y="649" fill="#475569" font-size="15">Slower adds muscular demand.</text>
  </g>

  <text x="600" y="727" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="15" font-weight="700">Change one main control at a time so the response stays readable.</text>
</svg>
