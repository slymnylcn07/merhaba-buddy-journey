<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Knee-friendly cardio machine selection pathway</title>
  <desc id="desc">A decision pathway that starts with comfortable level walking, compares an incline treadmill and a stair-style machine, and uses movement quality and next-day response to guide progression.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#bg2)"/>
  <text x="600" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Choose a test, then let the knee response decide</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Use a repeatable session instead of chasing the hardest machine.</text>

  <g filter="url(#shadow2)" font-family="Arial, sans-serif">
    <rect x="390" y="132" width="420" height="94" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="438" cy="179" r="24" fill="#e2e8f0"/>
    <path d="M427 180h22M438 169v22" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <text x="482" y="170" font-size="20" font-weight="700" fill="#0f172a">Start with a calm baseline</text>
    <text x="482" y="197" font-size="16" fill="#475569">Comfortable level walking and normal gait</text>

    <rect x="74" y="316" width="454" height="144" rx="26" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="672" y="316" width="454" height="144" rx="26" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="301" y="356" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Incline treadmill first</text>
    <text x="108" y="389" font-size="16" fill="#475569">Best when you want smaller control steps:</text>
    <text x="108" y="418" font-size="16" fill="#0f172a">low grade + chosen speed + shorter duration</text>
    <text x="899" y="356" text-anchor="middle" font-size="22" font-weight="700" fill="#047857">Stair-style machine first</text>
    <text x="706" y="389" font-size="16" fill="#475569">Best when stair climbing is already tolerated:</text>
    <text x="706" y="418" font-size="16" fill="#0f172a">low level + upright posture + brief exposure</text>

    <rect x="298" y="540" width="604" height="142" rx="28" fill="#0f172a"/>
    <text x="600" y="579" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Keep, reduce, or switch?</text>
    <text x="600" y="612" text-anchor="middle" font-size="16" fill="#cbd5e1">Keep when gait stays normal and the next morning returns to baseline.</text>
    <text x="600" y="641" text-anchor="middle" font-size="16" fill="#cbd5e1">Reduce one dial when symptoms clearly rise. Switch if the movement remains provocative.</text>
  </g>

  <path d="M490 226C432 256 364 270 317 316" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M710 226C768 256 836 270 883 316" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M301 460C338 505 417 517 476 540" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M899 460C862 505 783 517 724 540" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow2)"/>

  <g font-family="Arial, sans-serif">
    <rect x="92" y="504" width="177" height="34" rx="17" fill="#dbeafe"/>
    <text x="180" y="527" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Change one dial</text>
    <rect x="931" y="504" width="177" height="34" rx="17" fill="#d1fae5"/>
    <text x="1019" y="527" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Do not lean on rails</text>
    <text x="600" y="724" text-anchor="middle" font-size="16" fill="#475569">Zone 2 cardio describes your effort, not a machine setting. Use a sustainable talk-test effort.</text>
  </g>
</svg>
