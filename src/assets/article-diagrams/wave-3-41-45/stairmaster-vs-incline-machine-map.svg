<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Stair-style machine and incline treadmill comparison</title>
  <desc id="desc">A side-by-side map comparing movement pattern, knee bend, controls, and response checks for a rotating stair-style machine and an incline treadmill.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#bg)"/>
  <text x="600" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Two machines, two different knee tests</text>
  <text x="600" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Neither machine is automatically better. Compare the movement and your response.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="136" width="516" height="438" rx="28" fill="#ffffff"/>
    <rect x="620" y="136" width="516" height="438" rx="28" fill="#ffffff"/>
  </g>

  <rect x="88" y="160" width="468" height="64" rx="20" fill="url(#blue)"/>
  <text x="322" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Rotating stair-style machine</text>
  <rect x="644" y="160" width="468" height="64" rx="20" fill="url(#green)"/>
  <text x="878" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Incline treadmill</text>

  <g transform="translate(106 254)">
    <path d="M0 150h66v-42h66V66h66V24h82" fill="none" stroke="#2563eb" stroke-width="18" stroke-linejoin="round"/>
    <circle cx="226" cy="14" r="15" fill="#0f172a"/>
    <path d="M222 32l-20 52 34 23 20 48M207 80l-39 28M235 104l38-36" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M254 156h35" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g transform="translate(668 252)">
    <path d="M8 153L284 75" stroke="#10b981" stroke-width="18" stroke-linecap="round"/>
    <path d="M24 167h282M285 72l22 95" fill="none" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>
    <circle cx="196" cy="34" r="15" fill="#0f172a"/>
    <path d="M192 52l-18 52 34 19 26 37M176 99l-41 21M208 123l36-40" fill="none" stroke="#0f172a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M232 160h34" stroke="#0f172a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, sans-serif">
    <circle cx="116" cy="446" r="7" fill="#2563eb"/>
    <text x="136" y="452" font-size="17" font-weight="700" fill="#0f172a">Pattern</text>
    <text x="224" y="452" font-size="17" fill="#475569">repeated climbing steps</text>
    <circle cx="116" cy="486" r="7" fill="#2563eb"/>
    <text x="136" y="492" font-size="17" font-weight="700" fill="#0f172a">Knee bend</text>
    <text x="241" y="492" font-size="17" fill="#475569">often deeper and repeated</text>
    <circle cx="116" cy="526" r="7" fill="#2563eb"/>
    <text x="136" y="532" font-size="17" font-weight="700" fill="#0f172a">Controls</text>
    <text x="218" y="532" font-size="17" fill="#475569">level and step cadence</text>

    <circle cx="672" cy="446" r="7" fill="#10b981"/>
    <text x="692" y="452" font-size="17" font-weight="700" fill="#0f172a">Pattern</text>
    <text x="780" y="452" font-size="17" fill="#475569">continuous uphill walking</text>
    <circle cx="672" cy="486" r="7" fill="#10b981"/>
    <text x="692" y="492" font-size="17" font-weight="700" fill="#0f172a">Knee bend</text>
    <text x="797" y="492" font-size="17" fill="#475569">changes with speed and grade</text>
    <circle cx="672" cy="526" r="7" fill="#10b981"/>
    <text x="692" y="532" font-size="17" font-weight="700" fill="#0f172a">Controls</text>
    <text x="774" y="532" font-size="17" fill="#475569">speed and incline</text>
  </g>

  <rect x="64" y="614" width="1072" height="102" rx="24" fill="#0f172a"/>
  <text x="106" y="651" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Judge the session at three checkpoints</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="106" y="670" width="260" height="30" rx="15" fill="#1e3a8a"/>
    <text x="236" y="691" text-anchor="middle" fill="#dbeafe">1. During: gait stays normal</text>
    <rect x="470" y="670" width="260" height="30" rx="15" fill="#065f46"/>
    <text x="600" y="691" text-anchor="middle" fill="#d1fae5">2. After: no new swelling</text>
    <rect x="834" y="670" width="260" height="30" rx="15" fill="#713f12"/>
    <text x="964" y="691" text-anchor="middle" fill="#fef3c7">3. Next morning: baseline</text>
  </g>
</svg>
