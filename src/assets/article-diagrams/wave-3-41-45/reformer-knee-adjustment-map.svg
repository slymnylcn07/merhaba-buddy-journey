<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reformer Pilates knee adjustment map</title>
  <desc id="desc">Four adjustable reformer choices for knee comfort: springs, footbar, range, and body position, with a reminder to change one choice at a time.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182d"/>
      <stop offset="1" stop-color="#123d5b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="34" fill="#f8fafc"/>
  <text x="54" y="64" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">Four dials shape the same reformer exercise</text>
  <text x="54" y="101" fill="#475569" font-family="Arial, sans-serif" font-size="18">A spring change is only one option. Test one adjustment, then observe the knee.</text>

  <rect x="50" y="135" width="520" height="510" rx="30" fill="url(#panel)"/>
  <text x="310" y="184" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="22" font-weight="700">Controlled footwork setup</text>

  <rect x="120" y="402" width="360" height="94" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
  <rect x="166" y="424" width="267" height="48" rx="12" fill="#cbd5e1"/>
  <circle cx="212" cy="448" r="16" fill="#0f172a"/>
  <circle cx="388" cy="448" r="16" fill="#0f172a"/>
  <path d="M116 495 L87 586 M484 495 L513 586" stroke="#94a3b8" stroke-width="15" stroke-linecap="round"/>

  <path d="M118 405 L118 284" stroke="#38bdf8" stroke-width="15" stroke-linecap="round"/>
  <path d="M96 286 L141 286" stroke="#38bdf8" stroke-width="15" stroke-linecap="round"/>
  <path d="M142 286 L220 359" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  <path d="M220 359 L301 397" stroke="#f8fafc" stroke-width="15" stroke-linecap="round"/>
  <circle cx="198" cy="337" r="23" fill="#f8fafc"/>
  <path d="M220 359 L278 324" stroke="#f8fafc" stroke-width="13" stroke-linecap="round"/>
  <path d="M277 324 L342 286" stroke="#f8fafc" stroke-width="13" stroke-linecap="round"/>
  <path d="M300 398 L374 367" stroke="#f8fafc" stroke-width="15" stroke-linecap="round"/>
  <path d="M373 367 L404 295" stroke="#f8fafc" stroke-width="15" stroke-linecap="round"/>
  <circle cx="409" cy="286" r="10" fill="#fbbf24"/>
  <circle cx="347" cy="283" r="10" fill="#fbbf24"/>

  <path d="M185 532 C210 510 235 554 260 532 C285 510 310 554 335 532 C360 510 385 554 410 532" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"/>
  <text x="300" y="579" text-anchor="middle" fill="#99f6e4" font-family="Arial, sans-serif" font-size="17" font-weight="700">Smooth press and controlled return</text>
  <text x="300" y="608" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Comfortable depth matters more than copying a neighbor.</text>

  <path d="M574 390 L630 390" stroke="#38bdf8" stroke-width="7" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif">
    <rect x="655" y="140" width="228" height="216" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="705" cy="192" r="29" fill="#2563eb"/>
    <path d="M690 192 C697 177 704 207 711 192 C718 177 725 207 732 192" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="689" y="249" fill="#1e3a8a" font-size="22" font-weight="700">Springs</text>
    <text x="689" y="282" fill="#475569" font-size="16">Enough support for</text>
    <text x="689" y="305" fill="#475569" font-size="16">smooth control, without</text>
    <text x="689" y="328" fill="#475569" font-size="16">forcing the press.</text>

    <rect x="910" y="140" width="240" height="216" rx="24" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="960" cy="192" r="29" fill="#059669"/>
    <path d="M944 201 L944 181 M944 181 L976 181 M976 181 L976 201" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="944" y="249" fill="#065f46" font-size="22" font-weight="700">Footbar</text>
    <text x="944" y="282" fill="#475569" font-size="16">Secure foot contact</text>
    <text x="944" y="305" fill="#475569" font-size="16">with comfortable ankle,</text>
    <text x="944" y="328" fill="#475569" font-size="16">knee, and hip positions.</text>

    <rect x="655" y="386" width="228" height="216" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="705" cy="438" r="29" fill="#ea580c"/>
    <path d="M689 450 A23 23 0 0 1 722 420" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M717 414 L727 420 L720 429" fill="#fff"/>
    <text x="689" y="495" fill="#9a3412" font-size="22" font-weight="700">Range</text>
    <text x="689" y="528" fill="#475569" font-size="16">Stop before the painful</text>
    <text x="689" y="551" fill="#475569" font-size="16">depth. A smaller bend</text>
    <text x="689" y="574" fill="#475569" font-size="16">is still useful work.</text>

    <rect x="910" y="386" width="240" height="216" rx="24" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/>
    <circle cx="960" cy="438" r="29" fill="#db2777"/>
    <circle cx="960" cy="427" r="8" fill="#fff"/>
    <path d="M960 437 L960 461 M960 445 L945 454 M960 445 L975 454" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="944" y="495" fill="#9d174d" font-size="22" font-weight="700">Position</text>
    <text x="944" y="528" fill="#475569" font-size="16">Use supine, seated, or</text>
    <text x="944" y="551" fill="#475569" font-size="16">side-lying alternatives</text>
    <text x="944" y="574" fill="#475569" font-size="16">when kneeling hurts.</text>
  </g>

  <rect x="232" y="678" width="736" height="48" rx="24" fill="#07182d"/>
  <text x="600" y="709" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="18" font-weight="700">Change one dial at a time, then check the knee later that day and next morning.</text>
</svg>
