<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Incline walking and 12-3-30 demand map</title>
  <desc id="desc">A treadmill hill illustration showing that grade, speed, and time combine, with a separate explanation of the 12-3-30 workout and outdoor downhill demand.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#bg4)"/>
  <text x="600" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Incline is only one part of the workout</text>
  <text x="600" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">The same grade can feel different when pace, time, support, or recent training changes.</text>

  <g filter="url(#shadow4)">
    <rect x="60" y="140" width="714" height="430" rx="28" fill="#ffffff"/>
    <rect x="814" y="140" width="326" height="430" rx="28" fill="#ffffff"/>
  </g>

  <g transform="translate(98 190)">
    <path d="M0 260H90L624 72" fill="none" stroke="url(#hill)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 282h620M625 70l25 212" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="455" cy="86" r="16" fill="#0f172a"/>
    <path d="M450 105l-25 62 41 26 30 54M429 162l-47 28M465 192l46-49" fill="none" stroke="#0f172a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M493 248h38" stroke="#0f172a" stroke-width="11" stroke-linecap="round"/>

    <g font-family="Arial, sans-serif">
      <rect x="5" y="306" width="174" height="56" rx="18" fill="#eff6ff"/>
      <text x="92" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">LOWER GRADE</text>
      <text x="92" y="350" text-anchor="middle" font-size="14" fill="#475569">first exposure</text>
      <rect x="222" y="306" width="174" height="56" rx="18" fill="#ecfdf5"/>
      <text x="309" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">MORE GRADE</text>
      <text x="309" y="350" text-anchor="middle" font-size="14" fill="#475569">more uphill demand</text>
      <rect x="439" y="306" width="174" height="56" rx="18" fill="#fff7ed"/>
      <text x="526" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">ADD TIME LAST</text>
      <text x="526" y="350" text-anchor="middle" font-size="14" fill="#475569">after tolerance is clear</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="977" y="191" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">What 12-3-30 means</text>
    <circle cx="884" cy="261" r="42" fill="#dbeafe"/>
    <text x="884" y="270" text-anchor="middle" font-size="27" font-weight="700" fill="#1d4ed8">12</text>
    <text x="943" y="255" font-size="17" font-weight="700" fill="#0f172a">12% grade</text>
    <text x="943" y="280" font-size="15" fill="#475569">not 12 degrees</text>
    <circle cx="884" cy="354" r="42" fill="#d1fae5"/>
    <text x="884" y="363" text-anchor="middle" font-size="27" font-weight="700" fill="#047857">3</text>
    <text x="943" y="348" font-size="17" font-weight="700" fill="#0f172a">3 mph</text>
    <text x="943" y="373" font-size="15" fill="#475569">a brisk pace for many</text>
    <circle cx="884" cy="447" r="42" fill="#ffedd5"/>
    <text x="884" y="456" text-anchor="middle" font-size="24" font-weight="700" fill="#c2410c">30</text>
    <text x="943" y="441" font-size="17" font-weight="700" fill="#0f172a">30 minutes</text>
    <text x="943" y="466" font-size="15" fill="#475569">a long first test for some</text>
    <text x="977" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">A named workout, not a clinical</text>
    <text x="977" y="538" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">starting standard.</text>
  </g>

  <rect x="60" y="612" width="1080" height="94" rx="24" fill="#0f172a"/>
  <text x="104" y="650" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Treadmill and outdoor hills are not identical</text>
  <text x="104" y="679" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">The treadmill keeps climbing. An outdoor route usually adds downhill braking, uneven ground, weather, and turns on the return.</text>
</svg>
