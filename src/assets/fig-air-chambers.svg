<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#FFFFFF"/>
<text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#0F172A">How sequential air chambers move fluid upward</text>
<g transform="translate(150,80)">
<rect x="60" y="20" width="170" height="300" rx="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
<rect x="76" y="236" width="138" height="66" rx="22" fill="#0EA5E9"/>
<rect x="76" y="162" width="138" height="66" rx="22" fill="#7DD3FC"/>
<rect x="76" y="88" width="138" height="66" rx="22" fill="#E0F2FE"/>
<text x="145" y="275" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#FFF">1</text>
<text x="145" y="200" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#0369A1">2</text>
<text x="145" y="126" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#0369A1">3</text>
<path d="M270 280 L 270 110" stroke="#0284C7" stroke-width="8" stroke-linecap="round" marker-end="none"/>
<path d="M255 130 L 270 105 L 285 130" stroke="#0284C7" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="150" font-family="Arial" font-size="20" fill="#0369A1">Fluid pushed toward</text>
<text x="300" y="176" font-family="Arial" font-size="20" fill="#0369A1">the heart</text>
<text x="300" y="250" font-family="Arial" font-size="19" fill="#475569">Chambers inflate in sequence</text>
<text x="300" y="276" font-family="Arial" font-size="19" fill="#475569">from ankle to knee, then release</text>
<text x="300" y="302" font-family="Arial" font-size="19" fill="#475569">like a wave, mimicking muscle pumping</text>
</g>
</svg>
