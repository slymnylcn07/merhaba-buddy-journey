<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480">
  <rect width="1000" height="480" fill="#F8FAFC"/>
  <text x="500" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="bold" fill="#0F172A">Why the ache arrives the next day</text>

  <line x1="90" y1="250" x2="910" y2="250" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>

  <g font-family="Arial,Helvetica,sans-serif">
    <circle cx="160" cy="250" r="17" fill="#22C55E"/>
    <text x="160" y="200" text-anchor="middle" font-size="19" font-weight="bold" fill="#166534">During exercise</text>
    <text x="160" y="300" text-anchor="middle" font-size="16" fill="#475569">Little or no pain.</text>
    <text x="160" y="322" text-anchor="middle" font-size="16" fill="#475569">Adrenaline and warm</text>
    <text x="160" y="344" text-anchor="middle" font-size="16" fill="#475569">tissue mask the load.</text>

    <circle cx="410" cy="250" r="17" fill="#F59E0B"/>
    <text x="410" y="200" text-anchor="middle" font-size="19" font-weight="bold" fill="#92400E">2 to 6 hours after</text>
    <text x="410" y="300" text-anchor="middle" font-size="16" fill="#475569">Tissue cools, small</text>
    <text x="410" y="322" text-anchor="middle" font-size="16" fill="#475569">inflammatory response</text>
    <text x="410" y="344" text-anchor="middle" font-size="16" fill="#475569">begins quietly.</text>

    <circle cx="660" cy="250" r="17" fill="#EF4444"/>
    <text x="660" y="200" text-anchor="middle" font-size="19" font-weight="bold" fill="#B91C1C">12 to 24 hours after</text>
    <text x="660" y="300" text-anchor="middle" font-size="16" fill="#475569">Soreness peaks. Stairs</text>
    <text x="660" y="322" text-anchor="middle" font-size="16" fill="#475569">and standing up feel</text>
    <text x="660" y="344" text-anchor="middle" font-size="16" fill="#475569">the worst.</text>

    <circle cx="880" cy="250" r="17" fill="#3B82F6"/>
    <text x="880" y="200" text-anchor="middle" font-size="19" font-weight="bold" fill="#1D4ED8">48 to 72 hours</text>
    <text x="880" y="300" text-anchor="middle" font-size="16" fill="#475569">Settles as tissue</text>
    <text x="880" y="322" text-anchor="middle" font-size="16" fill="#475569">adapts and recovers.</text>
  </g>

  <text x="500" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B" font-style="italic">Pain that appears during the activity, or swelling and locking, follows a different pattern and deserves a check.</text>
</svg>
