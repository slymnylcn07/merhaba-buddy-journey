<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d">
<title id="t">Saddle height and knee pain</title><desc id="d">Three saddle heights showing knee angle and where pain appears.</desc>
<defs>
  <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
  <linearGradient id="leg3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f1f5f9"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
</defs>
<rect width="1400" height="820" fill="url(#bg3)"/>
<text x="70" y="90" font-family="Inter,Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#0f172a">Saddle height decides which side of the knee complains</text>
<text x="70" y="136" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" fill="#64748b">Measured at the bottom of the pedal stroke, with the heel level and the hips still.</text>


<g transform="translate(80,190)">
  <rect x="0" y="0" width="400" height="560" rx="24" fill="#ffffff" stroke="#ef4444" stroke-width="4"/>
  <text x="200" y="56" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#ef4444">Too low</text>
  <text x="200" y="92" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#64748b">Knee bends past 40&#176;</text>
  <g transform="translate(70,120)">
    <circle cx="130" cy="300" r="72" fill="none" stroke="#94a3b8" stroke-width="8"/>
    <circle cx="130" cy="300" r="8" fill="#64748b"/>
    <rect x="96" y="78" width="86" height="18" rx="9" fill="#0f172a"/>
    <path d="M139 96 L214 206" stroke="url(#leg3)" stroke-width="30" stroke-linecap="round"/>
    <path d="M214 206 L130 372" stroke="url(#leg3)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="214" cy="206" r="26" fill="#ffffff" stroke="#ef4444" stroke-width="7"/>
    <rect x="104" y="364" width="54" height="14" rx="7" fill="#334155"/>
  </g>
  <rect x="30" y="470" width="340" height="66" rx="14" fill="#fee2e2"/>
  <text x="200" y="498" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ef4444">Front of the knee</text>
  <text x="200" y="524" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Raise in 3 mm steps</text>
</g>

<g transform="translate(520,190)">
  <rect x="0" y="0" width="400" height="560" rx="24" fill="#ffffff" stroke="#059669" stroke-width="4"/>
  <text x="200" y="56" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#059669">About right</text>
  <text x="200" y="92" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#64748b">25&#176; to 35&#176; at the bottom</text>
  <g transform="translate(70,120)">
    <circle cx="130" cy="300" r="72" fill="none" stroke="#94a3b8" stroke-width="8"/>
    <circle cx="130" cy="300" r="8" fill="#64748b"/>
    <rect x="96" y="50" width="86" height="18" rx="9" fill="#0f172a"/>
    <path d="M139 68 L206 190" stroke="url(#leg3)" stroke-width="30" stroke-linecap="round"/>
    <path d="M206 190 L130 372" stroke="url(#leg3)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="206" cy="190" r="26" fill="#ffffff" stroke="#059669" stroke-width="7"/>
    <rect x="104" y="364" width="54" height="14" rx="7" fill="#334155"/>
  </g>
  <rect x="30" y="470" width="340" height="66" rx="14" fill="#d1fae5"/>
  <text x="200" y="498" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#059669">No single hot spot</text>
  <text x="200" y="524" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Leave it alone</text>
</g>

<g transform="translate(960,190)">
  <rect x="0" y="0" width="400" height="560" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="4"/>
  <text x="200" y="56" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#0ea5e9">Too high</text>
  <text x="200" y="92" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#64748b">Knee close to locked</text>
  <g transform="translate(70,120)">
    <circle cx="130" cy="300" r="72" fill="none" stroke="#94a3b8" stroke-width="8"/>
    <circle cx="130" cy="300" r="8" fill="#64748b"/>
    <rect x="96" y="18" width="86" height="18" rx="9" fill="#0f172a"/>
    <path d="M139 36 L190 176" stroke="url(#leg3)" stroke-width="30" stroke-linecap="round"/>
    <path d="M190 176 L130 372" stroke="url(#leg3)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="190" cy="176" r="26" fill="#ffffff" stroke="#0ea5e9" stroke-width="7"/>
    <rect x="104" y="364" width="54" height="14" rx="7" fill="#334155"/>
  </g>
  <rect x="30" y="470" width="340" height="66" rx="14" fill="#e0f2fe"/>
  <text x="200" y="498" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#0ea5e9">Back of the knee</text>
  <text x="200" y="524" text-anchor="middle" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#475569">Lower in 3 mm steps</text>
</g>

</svg>