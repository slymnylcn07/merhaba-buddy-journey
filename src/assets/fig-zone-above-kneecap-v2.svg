<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#FFFFFF"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Pain ABOVE the kneecap</text>
  <text x="450" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B">The quadriceps tendon zone</text>

  <path d="M390 100 C 460 96 508 116 512 175 L 518 290 C 520 330 512 360 512 400 C 512 460 520 500 516 530 L 384 530 C 380 500 388 460 388 400 C 388 360 380 330 382 290 L 388 175 C 388 116 390 100 390 100 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>

  <!-- quad muscle feeding in -->
  <path d="M410 110 C 424 140 430 160 428 180" stroke="#FCA5A5" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M490 110 C 476 140 470 160 472 180" stroke="#FCA5A5" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.8"/>
  <text x="130" y="150" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#B91C1C">Quadriceps muscle</text>
  <text x="130" y="172" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">pulls through this tendon</text>
  <line x1="300" y1="146" x2="404" y2="140" stroke="#FCA5A5" stroke-width="2"/>

  <!-- THE tendon, highlighted -->
  <path d="M416 186 C 440 216 462 216 484 186" stroke="#A855F7" stroke-width="20" fill="none" stroke-linecap="round"/>
  <ellipse cx="450" cy="200" rx="62" ry="34" fill="#A855F7" opacity="0.3"/>
  <ellipse cx="450" cy="200" rx="82" ry="48" fill="#A855F7" opacity="0.12"/>
  <text x="600" y="188" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#6B21A8">Quadriceps tendon</text>
  <text x="600" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">Connects the thigh muscle</text>
  <text x="600" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">to the TOP of the kneecap.</text>
  <line x1="592" y1="182" x2="510" y2="192" stroke="#C084FC" stroke-width="2"/>

  <!-- kneecap below the tendon -->
  <ellipse cx="450" cy="286" rx="40" ry="50" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <text x="450" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#92400E">kneecap</text>

  <!-- pattern box -->
  <rect x="120" y="330" width="330" height="150" rx="16" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="2"/>
  <text x="145" y="362" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#6B21A8">Typical pattern</text>
  <text x="145" y="392" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Sore after squats, lunges, leg press</text>
  <text x="145" y="416" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Often follows a jump in training load</text>
  <text x="145" y="440" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Tender when you press just above</text>
  <text x="145" y="464" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">the top edge of the kneecap</text>

  <text x="450" y="552" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B" font-style="italic">Above-kneecap pain is less common than below, and usually load related.</text>
</svg>
