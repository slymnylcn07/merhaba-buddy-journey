<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <rect width="900" height="480" fill="#F8FAFC"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Micro-movements that save your knees on shift</text>
  <text x="450" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B">Small changes you can do without leaving your station</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(150,180)">
      <circle cx="0" cy="0" r="50" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
      <path d="M-16 20 l0 -30 M0 20 l0 -40 M16 20 l0 -30" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
      <text x="0" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1D4ED8">Shift weight</text>
      <text x="0" y="112" text-anchor="middle" font-size="13" fill="#475569">Rock foot to foot</text>
      <text x="0" y="130" text-anchor="middle" font-size="13" fill="#475569">every few minutes</text>
    </g>
    <g transform="translate(380,180)">
      <circle cx="0" cy="0" r="50" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
      <path d="M0 -22 a 22 22 0 1 1 -0.1 0 M0 -22 l0 12" stroke="#16A34A" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="0" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Calf raises</text>
      <text x="0" y="112" text-anchor="middle" font-size="13" fill="#475569">10 slow raises to</text>
      <text x="0" y="130" text-anchor="middle" font-size="13" fill="#475569">pump the lower leg</text>
    </g>
    <g transform="translate(610,180)">
      <circle cx="0" cy="0" r="50" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
      <path d="M-18 -8 q 18 -20 36 0 M-18 8 q 18 -20 36 0" stroke="#D97706" stroke-width="4" fill="none"/>
      <text x="0" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400E">Soft knees</text>
      <text x="0" y="112" text-anchor="middle" font-size="13" fill="#475569">Keep a micro-bend,</text>
      <text x="0" y="130" text-anchor="middle" font-size="13" fill="#475569">never lock them out</text>
    </g>
    <g transform="translate(800,180)">
      <circle cx="0" cy="0" r="50" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
      <path d="M-14 0 l28 0 M6 -12 l12 12 l-12 12" stroke="#7C3AED" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#5B21B6">Step away</text>
      <text x="0" y="112" text-anchor="middle" font-size="13" fill="#475569">A short walk each</text>
      <text x="0" y="130" text-anchor="middle" font-size="13" fill="#475569">break resets the load</text>
    </g>
  </g>
  <text x="450" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B" font-style="italic">The goal is to keep changing position, so no single tissue carries the load the whole shift.</text>
</svg>
