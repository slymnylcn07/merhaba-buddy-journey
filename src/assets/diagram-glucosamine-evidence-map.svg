<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Why glucosamine and chondroitin research disagrees</title><desc id="desc">A four-part map showing differences in formulation, study quality, patient groups, and outcomes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient></defs>
<rect width="1400" height="900" rx="44" fill="url(#bg)"/>
<text x="700" y="90" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#0f172a">Why studies can reach different answers</text>
<g font-family="Arial">
 <g transform="translate(90 160)"><rect width="560" height="260" rx="32" fill="#fff" stroke="#bfdbfe" stroke-width="4"/><circle cx="80" cy="80" r="44" fill="#2563eb"/><text x="80" y="94" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">1</text><text x="150" y="72" font-size="34" font-weight="700" fill="#0f172a">Different formulations</text><text x="150" y="125" font-size="27" fill="#475569">Sulfate vs hydrochloride</text><text x="150" y="165" font-size="27" fill="#475569">Prescription-grade vs retail products</text><text x="150" y="205" font-size="27" fill="#475569">Single ingredient vs combinations</text></g>
 <g transform="translate(750 160)"><rect width="560" height="260" rx="32" fill="#fff" stroke="#bfdbfe" stroke-width="4"/><circle cx="80" cy="80" r="44" fill="#0ea5e9"/><text x="80" y="94" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">2</text><text x="150" y="72" font-size="34" font-weight="700" fill="#0f172a">Different participants</text><text x="150" y="125" font-size="27" fill="#475569">Mild vs advanced osteoarthritis</text><text x="150" y="165" font-size="27" fill="#475569">Low vs moderate-to-severe pain</text><text x="150" y="205" font-size="27" fill="#475569">Different joints and age groups</text></g>
 <g transform="translate(90 500)"><rect width="560" height="260" rx="32" fill="#fff" stroke="#bfdbfe" stroke-width="4"/><circle cx="80" cy="80" r="44" fill="#14b8a6"/><text x="80" y="94" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">3</text><text x="150" y="72" font-size="34" font-weight="700" fill="#0f172a">Different outcomes</text><text x="150" y="125" font-size="27" fill="#475569">Pain, function, stiffness</text><text x="150" y="165" font-size="27" fill="#475569">Short-term response vs structure</text><text x="150" y="205" font-size="27" fill="#475569">Average change vs responder rate</text></g>
 <g transform="translate(750 500)"><rect width="560" height="260" rx="32" fill="#fff" stroke="#bfdbfe" stroke-width="4"/><circle cx="80" cy="80" r="44" fill="#f59e0b"/><text x="80" y="94" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">4</text><text x="150" y="72" font-size="34" font-weight="700" fill="#0f172a">Different study quality</text><text x="150" y="125" font-size="27" fill="#475569">Sample size and duration</text><text x="150" y="165" font-size="27" fill="#475569">Industry sponsorship and bias</text><text x="150" y="205" font-size="27" fill="#475569">Placebo response and adherence</text></g>
</g>
<text x="700" y="840" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1e3a8a">“Glucosamine” is not one perfectly standardized intervention.</text>
</svg>
