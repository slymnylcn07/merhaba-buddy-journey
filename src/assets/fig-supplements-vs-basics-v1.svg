  <text x="450" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B">The base of the pyramid does the heavy lifting</text>

  <!-- pyramid -->
  <path d="M450 110 L 560 200 L 340 200 Z" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="450" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#B91C1C">Supplements</text>

