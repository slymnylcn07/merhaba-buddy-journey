<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#FFFFFF"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Pain right on the joint line</text>
  <text x="450" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B">The gap between the thigh bone and the shin bone</text>

  <!-- bones with a clear gap -->
  <path d="M400 110 C 460 106 502 122 506 176 L 510 250 L 390 250 L 390 176 C 390 122 400 110 400 110 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
  <ellipse cx="420" cy="272" rx="40" ry="34" fill="#E7E5E4" stroke="#A8A29E" stroke-width="3"/>
  <ellipse cx="482" cy="272" rx="38" ry="34" fill="#E7E5E4" stroke="#A8A29E" stroke-width="3"/>
  <text x="600" y="176" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#44403C">Femur (thigh bone)</text>
  <line x1="592" y1="170" x2="508" y2="190" stroke="#A8A29E" stroke-width="2"/>

  <!-- MENISCUS in the gap -->
  <path d="M376 318 C 420 302 486 302 528 318" stroke="#0EA5E9" stroke-width="16" fill="none" stroke-linecap="round"/>
  <ellipse cx="452" cy="316" rx="92" ry="26" fill="#0EA5E9" opacity="0.25"/>
  <ellipse cx="452" cy="316" rx="112" ry="38" fill="#0EA5E9" opacity="0.1"/>
  <text x="600" y="306" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0369A1">Meniscus</text>
  <text x="600" y="330" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">Two C-shaped pads that sit exactly</text>
  <text x="600" y="350" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">in this gap and absorb load.</text>
  <line x1="592" y1="300" x2="540" y2="312" stroke="#7DD3FC" stroke-width="2"/>

  <path d="M408 350 C 450 342 496 350 500 380 L 498 500 L 418 500 Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="3"/>
  <text x="600" y="452" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#44403C">Tibia (shin bone)</text>
  <line x1="592" y1="446" x2="500" y2="424" stroke="#A8A29E" stroke-width="2"/>

  <!-- press test -->
  <g transform="translate(200,300)">
    <circle cx="0" cy="0" r="26" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#DC2626"/>
    <text x="-70" y="60" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#B91C1C">Press here</text>
    <text x="-110" y="84" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">Bend the knee, feel for the</text>
    <text x="-110" y="104" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">soft gap, then press gently.</text>
    <text x="-110" y="124" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">Tenderness on the line points</text>
    <text x="-110" y="144" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">to the joint, not the muscles.</text>
    <path d="M30 4 L 168 12" stroke="#FCA5A5" stroke-width="2"/>
  </g>

  <text x="450" y="552" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B" font-style="italic">Joint-line pain with locking, catching or giving way should be assessed.</text>
</svg>
