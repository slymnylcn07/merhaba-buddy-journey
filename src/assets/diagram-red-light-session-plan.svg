<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">A cautious red light therapy trial schedule</title><desc id="desc">A four-stage plan to follow instructions, start conservatively, track response, and review after four to eight weeks.</desc>
<rect width="1400" height="900" rx="44" fill="#f8fafc"/>
<text x="700" y="82" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#0f172a">A practical home-use trial — not a universal prescription</text>
<g font-family="Arial">
 <g transform="translate(80 160)"><rect width="1240" height="150" rx="35" fill="#fee2e2" stroke="#ef4444" stroke-width="5"/><circle cx="85" cy="75" r="45" fill="#dc2626"/><text x="85" y="90" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">1</text><text x="165" y="62" font-size="34" font-weight="700" fill="#0f172a">Read the device instructions and contraindications</text><text x="165" y="108" font-size="27" fill="#475569">Confirm session time, distance/contact, eye guidance, charging, cleaning and heat limits.</text></g>
 <g transform="translate(80 340)"><rect width="1240" height="150" rx="35" fill="#fef3c7" stroke="#f59e0b" stroke-width="5"/><circle cx="85" cy="75" r="45" fill="#d97706"/><text x="85" y="90" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">2</text><text x="165" y="62" font-size="34" font-weight="700" fill="#0f172a">Start at the lower end of the labeled schedule</text><text x="165" y="108" font-size="27" fill="#475569">Do not double time because the light feels gentle; warmth is not a dose meter.</text></g>
 <g transform="translate(80 520)"><rect width="1240" height="150" rx="35" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><circle cx="85" cy="75" r="45" fill="#2563eb"/><text x="85" y="90" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">3</text><text x="165" y="62" font-size="34" font-weight="700" fill="#0f172a">Track function and tolerance, not just a single pain score</text><text x="165" y="108" font-size="27" fill="#475569">Note stairs, walking, stiffness, sleep, swelling, skin response and exercise consistency.</text></g>
 <g transform="translate(80 700)"><rect width="1240" height="150" rx="35" fill="#ccfbf1" stroke="#0f766e" stroke-width="5"/><circle cx="85" cy="75" r="45" fill="#0f766e"/><text x="85" y="90" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">4</text><text x="165" y="62" font-size="34" font-weight="700" fill="#0f172a">Review after 4–8 weeks</text><text x="165" y="108" font-size="27" fill="#475569">Continue only if benefit is meaningful, use is comfortable, and core care stays in place.</text></g>
</g>
</svg>
