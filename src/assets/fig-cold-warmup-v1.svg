<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#0F172A">A simple cold-day warm-up order</text>
  <text x="450" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B">Warm first, move second, then head out</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(120,150)">
      <circle cx="0" cy="0" r="46" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
      <path d="M-18 6 q 18 -22 36 0 M-18 18 q 18 -22 36 0" stroke="#D97706" stroke-width="4" fill="none"/>
      <text x="0" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400E">1. Warm</text>
      <text x="0" y="106" text-anchor="middle" font-size="14" fill="#475569">10-15 min of gentle</text>
      <text x="0" y="126" text-anchor="middle" font-size="14" fill="#475569">warmth on the knee</text>
    </g>
    <path d="M200 150 L 268 150" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/><path d="M268 150 l-16 -8 l0 16 Z" fill="#CBD5E1"/>
    <g transform="translate(340,150)">
      <circle cx="0" cy="0" r="46" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
      <path d="M-16 -10 l0 26 M0 -18 l0 34 M16 -10 l0 26" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
      <text x="0" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">2. Mobilize</text>
      <text x="0" y="106" text-anchor="middle" font-size="14" fill="#475569">Slow knee bends and</text>
      <text x="0" y="126" text-anchor="middle" font-size="14" fill="#475569">ankle circles indoors</text>
    </g>
    <path d="M420 150 L 488 150" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/><path d="M488 150 l-16 -8 l0 16 Z" fill="#CBD5E1"/>
    <g transform="translate(560,150)">
      <circle cx="0" cy="0" r="46" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
      <path d="M-14 14 L 0 -16 L 14 14 M-8 2 l16 0" stroke="#2563EB" stroke-width="4" fill="none" stroke-linejoin="round"/>
      <text x="0" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#1D4ED8">3. Layer</text>
      <text x="0" y="106" text-anchor="middle" font-size="14" fill="#475569">Cover the knee before</text>
      <text x="0" y="126" text-anchor="middle" font-size="14" fill="#475569">going out in the cold</text>
    </g>
    <path d="M640 150 L 708 150" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/><path d="M708 150 l-16 -8 l0 16 Z" fill="#CBD5E1"/>
    <g transform="translate(780,150)">
      <circle cx="0" cy="0" r="46" fill="#F1F5F9" stroke="#64748B" stroke-width="3"/>
      <path d="M-16 0 l32 0 M8 -12 l12 12 l-12 12" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#334155">4. Go</text>
      <text x="0" y="106" text-anchor="middle" font-size="14" fill="#475569">Start slow for the</text>
      <text x="0" y="126" text-anchor="middle" font-size="14" fill="#475569">first few minutes</text>
    </g>
  </g>
  <text x="450" y="450" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B" font-style="italic">Warming and moving before load usually helps more than pushing through a cold, stiff start.</text>
</svg>
