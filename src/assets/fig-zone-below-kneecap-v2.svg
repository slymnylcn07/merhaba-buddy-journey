<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#FFFFFF"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" fill="#0F172A">Pain BELOW the kneecap</text>
  <text x="450" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748B">The patellar tendon zone, often called jumper's knee</text>

  <path d="M390 100 C 460 96 508 116 512 175 L 518 290 C 520 330 512 360 512 400 C 512 460 520 500 516 530 L 384 530 C 380 500 388 460 388 400 C 388 360 380 330 382 290 L 388 175 C 388 116 390 100 390 100 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>

  <ellipse cx="450" cy="230" rx="40" ry="50" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <text x="450" y="236" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#92400E">kneecap</text>

  <!-- THE tendon, highlighted, below -->
  <path d="M448 286 L 452 372" stroke="#0EA5E9" stroke-width="20" stroke-linecap="round"/>
  <ellipse cx="450" cy="330" rx="42" ry="52" fill="#0EA5E9" opacity="0.3"/>
  <ellipse cx="450" cy="330" rx="58" ry="70" fill="#0EA5E9" opacity="0.12"/>
  <text x="600" y="322" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" fill="#0369A1">Patellar tendon</text>
  <text x="600" y="346" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">Runs from the BOTTOM of the</text>
  <text x="600" y="366" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">kneecap down to the shin bone.</text>
  <line x1="592" y1="316" x2="490" y2="326" stroke="#7DD3FC" stroke-width="2"/>

  <!-- attachment on tibia -->
  <ellipse cx="452" cy="386" rx="18" ry="12" fill="#94A3B8"/>
  <text x="600" y="426" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#334155">Attaches here on the shin</text>
  <text x="600" y="448" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">a bony bump you can feel</text>
  <line x1="592" y1="420" x2="474" y2="390" stroke="#CBD5E1" stroke-width="2"/>

  <rect x="120" y="290" width="300" height="160" rx="16" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2"/>
  <text x="145" y="322" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#0369A1">Typical pattern</text>
  <text x="145" y="352" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Hurts with jumping and landing</text>
  <text x="145" y="376" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Worse going downhill or downstairs</text>
  <text x="145" y="400" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Pinpoint tender on the tendon itself</text>
  <text x="145" y="424" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Often warms up, then returns after</text>

  <text x="450" y="552" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B" font-style="italic">This is one of the most common spots in runners and jumping sports.</text>
</svg>
