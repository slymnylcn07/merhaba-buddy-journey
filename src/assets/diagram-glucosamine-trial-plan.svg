<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">A structured supplement trial plan</title><desc id="desc">A decision pathway for discussing, testing, tracking, and stopping glucosamine or chondroitin.</desc>
<rect width="1400" height="900" rx="44" fill="#f8fafc"/>
<text x="700" y="90" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#0f172a">A safer way to test whether it helps you</text>
<g font-family="Arial" text-anchor="middle">
 <g transform="translate(60 190)"><rect width="250" height="310" rx="32" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><circle cx="125" cy="65" r="40" fill="#2563eb"/><text x="125" y="79" font-size="38" font-weight="700" fill="#fff">1</text><text x="125" y="145" font-size="31" font-weight="700" fill="#0f172a">Check first</text><text x="125" y="195" font-size="24" fill="#475569">Diagnosis, medicines,</text><text x="125" y="230" font-size="24" fill="#475569">allergies, pregnancy,</text><text x="125" y="265" font-size="24" fill="#475569">blood sugar and surgery</text></g>
 <path d="M325 345h70" stroke="#94a3b8" stroke-width="8" marker-end="url(#arrow)"/>
 <g transform="translate(390 190)"><rect width="250" height="310" rx="32" fill="#e0f2fe" stroke="#0284c7" stroke-width="5"/><circle cx="125" cy="65" r="40" fill="#0284c7"/><text x="125" y="79" font-size="38" font-weight="700" fill="#fff">2</text><text x="125" y="145" font-size="31" font-weight="700" fill="#0f172a">Choose one</text><text x="125" y="195" font-size="24" fill="#475569">Document form, dose,</text><text x="125" y="230" font-size="24" fill="#475569">brand and third-party</text><text x="125" y="265" font-size="24" fill="#475569">quality verification</text></g>
 <path d="M655 345h70" stroke="#94a3b8" stroke-width="8"/>
 <g transform="translate(720 190)"><rect width="250" height="310" rx="32" fill="#ccfbf1" stroke="#0f766e" stroke-width="5"/><circle cx="125" cy="65" r="40" fill="#0f766e"/><text x="125" y="79" font-size="38" font-weight="700" fill="#fff">3</text><text x="125" y="145" font-size="31" font-weight="700" fill="#0f172a">Track 8–12 weeks</text><text x="125" y="195" font-size="24" fill="#475569">Pain, walking, stairs,</text><text x="125" y="230" font-size="24" fill="#475569">sleep and rescue</text><text x="125" y="265" font-size="24" fill="#475569">medicine use</text></g>
 <path d="M985 345h70" stroke="#94a3b8" stroke-width="8"/>
 <g transform="translate(1050 190)"><rect width="290" height="310" rx="32" fill="#fef3c7" stroke="#d97706" stroke-width="5"/><circle cx="145" cy="65" r="40" fill="#d97706"/><text x="145" y="79" font-size="38" font-weight="700" fill="#fff">4</text><text x="145" y="145" font-size="31" font-weight="700" fill="#0f172a">Make a decision</text><text x="145" y="195" font-size="24" fill="#475569">Meaningful benefit?</text><text x="145" y="230" font-size="24" fill="#475569">No side effects?</text><text x="145" y="265" font-size="24" fill="#475569">Worth cost and burden?</text></g>
 <g transform="translate(260 620)"><rect width="380" height="140" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><text x="190" y="60" font-size="31" font-weight="700" fill="#166534">YES: review periodically</text><text x="190" y="105" font-size="24" fill="#475569">Keep exercise and core care in place</text></g>
 <g transform="translate(760 620)"><rect width="380" height="140" rx="28" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><text x="190" y="60" font-size="31" font-weight="700" fill="#991b1b">NO: stop rather than drift</text><text x="190" y="105" font-size="24" fill="#475569">Reassess the diagnosis and plan</text></g>
</g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
</svg>
